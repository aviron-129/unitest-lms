      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .admin-group-meta span { display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
    .admin-group-meta i { color: var(--role, var(--accent)); font-size: 0.76rem; }
    .admin-group-students {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .admin-group-students i { color: var(--role, var(--accent)); font-size: 0.78rem; }
    .admin-group-edit { align-self: flex-start; padding: 9px 14px; font-size: 0.82rem; }

    /* Модальное окно создания / редактирования группы */
    .admin-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .admin-modal-overlay.hidden { display: none; }
    .admin-modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      background: var(--surface-solid);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
    }
    .admin-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .admin-modal-title { font-size: 1.05rem; font-weight: 800; }
    .admin-modal-close {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .admin-modal-close:hover { color: var(--role, var(--accent)); border-color: var(--role, var(--accent)); }
    .admin-modal .form-grid { gap: 14px; }
    .admin-modal .form-actions { margin-top: 20px; }
    /* Динамические поля по роли (Промт №26): скрытые группы не занимают место */
    .admin-role-fields { min-width: 0; }
    .admin-role-fields[hidden] { display: none; }
    .admin-role-fields .form-grid { gap: 14px; }
    .admin-user-modal .field-input[type="number"] { min-width: 0; }
    @media (max-width: 479.98px) {
      .admin-modal-overlay { padding: 0; }
      .admin-modal { width: 100%; max-height: 100vh; min-height: 100vh; border-radius: 0; }
      .admin-modal .form-grid { grid-template-columns: 1fr; }
    }

    /* ============================================================
       6.8.3 ПАНЕЛЬ АДМИНИСТРАТОРА: НАЗНАЧЕНИЕ МЕНЕДЖЕРОВ (Промт №27)
       ============================================================ */
    .admin-managers-table td { vertical-align: middle; }
    .admin-manager-name {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .admin-manager-name i { color: var(--role, var(--accent)); font-size: 0.78rem; }
    .admin-manager-empty { color: var(--text-muted); font-style: italic; }
    .admin-manager-assign { padding: 9px 14px; font-size: 0.82rem; white-space: nowrap; }
    .admin-manager-card { display: flex; flex-direction: column; }
    .admin-manager-card .admin-manager-assign { align-self: flex-start; margin-top: 10px; }
    .admin-manager-modal .field-input { width: 100%; }

    /* ============================================================
       6.8.3 ПАНЕЛЬ АДМИНИСТРАТОРА: ГЛОБАЛЬНЫЕ ОТЧЁТЫ (Промт №28)
       ============================================================ */
    /* Фильтры: мобильный — столбиком, десктоп — в одну строку */
    .admin-reports-toolbar { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 16px; }
    .admin-reports-toolbar .field-input { min-width: 0; }
    .admin-reports-toolbar .btn-ghost { white-space: nowrap; }
    @media (min-width: 768px) {
      .admin-reports-toolbar { flex-direction: row; align-items: center; flex-wrap: wrap; }
      .admin-reports-toolbar .field-input { flex: 0 0 220px; }
      .admin-reports-toolbar .btn-ghost { margin-left: auto; }
    }

    /* Две карточки сводки: мобильный — 1, планшет/десктоп — 2 */
    .admin-report-stats { grid-template-columns: 1fr; }
    @media (min-width: 640px) { .admin-report-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .admin-report-stats .stat-card { margin: 0; }

    /* Прогресс-бар успеваемости: ширина = средний балл / 5, цвет — по порогам */
    .admin-report-progress { display: flex; align-items: center; gap: 10px; min-width: 120px; }
    .admin-report-progress .progress-track { flex: 1 1 auto; min-width: 80px; margin-top: 0; }
    .admin-report-pct {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .progress-fill--green  { background: linear-gradient(90deg, #10b981, #34d399); }
    .progress-fill--blue   { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .progress-fill--orange { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .progress-fill--gray   { background: rgba(148, 163, 184, 0.55); }
    [data-theme="dark"] .progress-fill--gray { background: rgba(148, 163, 184, 0.40); }
    .admin-report-card .progress-track { margin-top: 10px; }
    .admin-report-card .admin-report-progress { margin-top: 10px; }
    .admin-report-card .admin-report-progress .progress-track { margin-top: 0; }

    /* Справочники факультетов и курсов */
    .admin-ref-subtitle { margin: 4px 0 18px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    .admin-ref-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px)  { .admin-ref-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1180px) { .admin-ref-grid.admin-course-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .admin-ref-card {
      min-width: 0;
      padding: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .admin-ref-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      font-size: 0.95rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .admin-ref-title i { color: var(--role, var(--accent)); }
    .admin-ref-list { list-style: none; margin: 0; padding: 0; }
    .admin-ref-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.84rem;
    }
    .admin-ref-item:last-child { border-bottom: none; padding-bottom: 0; }
    .admin-ref-item > span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .admin-ref-count { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }
    .admin-ref-total {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .admin-ref-total span { color: var(--text-muted); }
    .admin-ref-total strong { font-size: 0.9rem; }

    /* ============================================================
       6.8.4 ПАНЕЛЬ АДМИНИСТРАТОРА: НАСТРОЙКИ И ЖУРНАЛ (Промт №29)
       ============================================================ */
    /* Десктоп: журнал слева, настройки справа; мобильный — друг под другом */
    .admin-settings-grid { display: grid; gap: 16px; margin-top: 20px; }
    @media (min-width: 1024px) {
      .admin-settings-grid { grid-template-columns: 1.2fr 1fr; align-items: start; }
    }

    /* Заголовок блока с кнопкой «Очистить журнал» */
    .admin-settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .admin-log-clear { padding: 8px 12px; font-size: 0.78rem; white-space: nowrap; }
    .admin-settings-note {
      margin: 8px 0 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Таблица журнала (десктоп) */
    .admin-logs-table-wrap { margin-top: 16px; }
    .admin-logs-table td { vertical-align: top; }
    .admin-log-time {
      color: var(--text-muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .admin-log-user { font-weight: 600; overflow-wrap: anywhere; }
    .admin-log-action { line-height: 1.45; overflow-wrap: anywhere; }

    /* Карточки журнала (мобильный) */
    .admin-log-cards { display: grid; gap: 10px; margin-top: 16px; }
    .admin-log-card {
      padding: 14px;
      background: var(--surface-solid);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
    }
    .admin-log-card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .admin-log-card-user {
      font-weight: 700;
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }
    .admin-log-card-action { margin-top: 8px; font-size: 0.86rem; line-height: 1.45; overflow-wrap: anywhere; }
    @media (min-width: 768px) { .admin-log-cards { display: none; } }
    @media (max-width: 767.98px) { .admin-logs-table-wrap { display: none; } }

    /* Системные настройки */
    .admin-settings-form { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .admin-settings-form .field-input { width: 100%; }
    .admin-settings-status {
      min-height: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }
    .admin-settings-status--ok { color: #10b981; }
    .admin-settings-status--error { color: #ef4444; }
    [data-theme="dark"] .admin-settings-status--ok { color: #34d399; }
    [data-theme="dark"] .admin-settings-status--error { color: #f87171; }

    /* Резервная копия */
    .admin-backup-card { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--card-border); }
    .admin-backup-card h4,
    .admin-danger h4 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 0.92rem;
      font-weight: 800;
    }
    .admin-backup-card p,
    .admin-danger p {
      margin: 0 0 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Опасная зона: красная рамка и кнопка */
    .admin-danger {
      margin-top: 18px;
      padding: 16px;
      border: 1.5px solid rgba(239, 68, 68, 0.45);
      border-radius: 14px;
      background: rgba(239, 68, 68, 0.06);
    }
    .admin-danger h4 { color: #dc2626; }
    [data-theme="dark"] .admin-danger h4 { color: #f87171; }
    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .btn-danger:hover { filter: brightness(1.07); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35); }
    .btn-danger:active { transform: scale(0.98); }

    /* На мобильном кнопки — на всю ширину */
    @media (max-width: 767.98px) {
      .admin-settings-form .btn-primary,
      .admin-backup-card .btn-ghost,
      .admin-danger .btn-danger { width: 100%; }
    }

    /* ============================================================
       6.9 СОЗДАНИЕ ТЕСТА. ШАГ 1: ОСНОВНЫЕ НАСТРОЙКИ (Промт №12)
       ============================================================ */
    /* Форма: на мобильном 1 колонка, на десктопе — max-width 800px по центру */
    .create-test-form { max-width: 800px; margin: 20px auto 0; }

    .form-card {
      padding: 20px;
      margin-bottom: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .form-card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
      font-size: 1rem;
      font-weight: 800;
    }
    .form-card-title i { color: var(--role, var(--accent)); }

    /* Поля: мобильный — 1 колонка, десктоп — 2 колонки */
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-full { grid-column: 1 / -1; }
    .field-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .field-hint { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
    .req { color: #ef4444; }

    /* Поля ввода — непрозрачные, чтобы текст читался в любой теме */
    .field-input {
      width: 100%;
      padding: 11px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface-solid);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .field-input::placeholder { color: var(--text-muted); opacity: 0.7; }
    .field-input:focus {
      border-color: var(--role, var(--accent));
      box-shadow: 0 0 0 3px var(--role-soft, rgba(99, 102, 241, 0.2));
    }
    .field-input[readonly] { background: var(--hover-bg); color: var(--text-muted); cursor: default; }

    /* Чекбоксы групп */
    .groups-checks { display: flex; flex-wrap: wrap; gap: 10px; }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      background: var(--surface-solid);
      border: 1.5px solid var(--surface-border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .check:hover { border-color: var(--role, var(--accent)); }
    .check input { width: 16px; height: 16px; accent-color: var(--role, var(--accent)); cursor: pointer; }
    .checks-empty { font-size: 0.85rem; color: var(--text-muted); }

    /* Кнопки формы: на мобильном — столбиком, на большом — справа */
    .form-actions { display: flex; flex-direction: column-reverse; gap: 12px; margin-top: 4px; }
    @media (min-width: 480px) { .form-actions { flex-direction: row; justify-content: flex-end; } }

    .btn-primary,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn-primary {
      border: none;
      color: #ffffff;
      background: var(--role, var(--accent));
    }
    .btn-primary:hover { filter: brightness(1.07); box-shadow: 0 8px 20px var(--role-soft, rgba(99, 102, 241, 0.4)); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--surface-border);
    }
    .btn-ghost:hover { border-color: var(--role, var(--accent)); color: var(--role, var(--accent)); }

    /* ============================================================
       6.10 СОЗДАНИЕ ТЕСТА. ШАГ 2: КОНСТРУКТОР ВОПРОСОВ (Промт №13)
       ============================================================ */
    /* Экран конструктора: те же габариты, что и у формы настроек (не растягивается) */
    .qb-screen { max-width: 800px; margin: 20px auto 0; }

    /* Текст вопроса */
    textarea.field-input { min-height: 92px; resize: vertical; line-height: 1.5; }

    /* Варианты ответов: радио-галочка + поле в одной строке */
    .q-options { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .q-section-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-top: 16px; }
    .q-option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      background: var(--surface-solid);
      border: 1.5px solid var(--surface-border);
      border-radius: 12px;
      transition: border-color 0.2s ease;
    }
    .q-option-row:focus-within { border-color: var(--role, var(--accent)); }
    .q-option-letter { width: 16px; flex-shrink: 0; font-size: 0.8rem; font-weight: 800; color: var(--text-muted); }
    .q-option-row input[type="radio"] {
      width: 17px; height: 17px; flex-shrink: 0;
      accent-color: var(--role, var(--accent)); cursor: pointer;
    }
    .q-option-row input[type="text"] {
      flex: 1; min-width: 0;
      padding: 6px 0;
      font-family: inherit; font-size: 0.9rem;
      color: var(--text); background: transparent;
      border: none; outline: none;
    }
    .q-option-row input[type="text"]::placeholder { color: var(--text-muted); opacity: 0.7; }

    /* Зелёное уведомление «Все вопросы добавлены!» (скрыто, пока лимит не набран) */
    .qb-done {
      display: none;
      align-items: center;
      gap: 9px;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .qb-done.is-visible { display: flex; }

    /* Предпросмотр: список добавленных вопросов */
    .q-list { display: flex; flex-direction: column; gap: 12px; }
    .q-list-empty { font-size: 0.85rem; color: var(--text-muted); }
    .q-item {
      padding: 14px 16px;
      background: var(--surface-solid);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
    }
    .q-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .q-item-text { font-size: 0.9rem; font-weight: 700; line-height: 1.45; word-break: break-word; }
    .q-item-num { color: var(--role, var(--accent)); margin-right: 6px; }
    .q-item-opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .q-item-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
      border-radius: 9px;
      color: var(--text);
      background: var(--hover-bg);
    }
    .q-item-opt i { flex-shrink: 0; width: 14px; font-size: 0.75rem; opacity: 0.65; }
    .q-item-opt.is-correct {
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .q-item-opt.is-correct i { opacity: 1; }

    /* Кнопка «Удалить» — крупная иконочная тач-цель */
    .q-delete {
      flex-shrink: 0;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .q-delete:hover { color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.10); }
    .q-diagram-edit {
      flex-shrink: 0;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }
    .q-diagram-edit:hover { border-color: var(--accent); background: rgba(99, 102, 241, 0.10); }
    @media (max-width: 479px) {
      .q-delete, .q-diagram-edit { width: 44px; height: 44px; font-size: 1rem; }
    }

    /* Навигация внизу экрана: на мобильном столбиком, дальше — в разные стороны */
    .qb-actions { display: flex; flex-direction: column-reverse; gap: 12px; margin-top: 18px; }
    @media (min-width: 480px) {
      .qb-actions { flex-direction: row; justify-content: space-between; }
      .qb-actions.qb-actions-start { justify-content: flex-start; }
    }

    /* ============================================================
       6.11 РАЗДЕЛ «МОИ ТЕСТЫ» ПРЕПОДАВАТЕЛЯ (Промт №14)
       ============================================================ */
    /* Строка «статус + удалить» под метой карточки теста.
       Сетка карточек — общая .tests-grid (1 → 2 → 3 колонки, адаптив уже есть). */
    .test-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
    /* Зелёный бейдж «Активен» */
    .test-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    /* Заглушка «нет тестов»: заголовок-плейсхолдер + кнопка столбиком */
    .tt-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 8px 0 24px;
    }
    .tt-empty .content-placeholder { width: 100%; }

    /* ============================================================
       6.12 РЕЗУЛЬТАТЫ И РАСПИСАНИЕ ПРЕПОДАВАТЕЛЯ (Промты №15–16)
       ============================================================ */
    /* Панель над таблицей: фильтр по тесту + кнопка экспорта (переносится на мобильном) */
    .tr-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px;
      margin-top: 20px;
    }
    .tr-filter { flex: 1 1 260px; max-width: 420px; }
    .tr-export { margin-left: auto; }

    /* Таблица результатов (структура — как у .transcript-table из зачётки) */
    .results-table-wrap {
      overflow-x: auto;                /* не ломает верстку при широком контенте */
      margin-top: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .results-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .results-table th {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }
    .results-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      vertical-align: middle;
    }
    .results-table tbody tr:last-child td { border-bottom: none; }
    .results-table tbody tr { transition: background-color 0.15s ease; }
    .results-table tbody tr:hover { background: var(--hover-bg); }

    /* Мобильные карточки результатов: по умолчанию скрыты (как .grade-cards) */
    .results-cards { display: none; }
    .results-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .results-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .results-card-name { font-weight: 700; font-size: 0.95rem; }
    .results-card-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .results-card-row i { width: 14px; text-align: center; }
    .results-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .results-card-points { font-weight: 700; font-size: 0.88rem; }

        <button class="lang-btn" data-lang="uz">UZ</button>
        <button class="lang-btn" data-lang="ru">RU</button>

      <button id="themeToggle" class="icon-btn" title="Сменить тему">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

         ============================================================ -->

      <p class="login-subtitle anim" data-i18n="chooseRole">Выберите роль</p>

      <div class="roles-grid">
        <!-- Администратор -->
        <button class="role-card role-admin anim" data-role="admin">
          <span class="role-icon"><i class="fas fa-user-shield"></i></span>
          <span class="role-name" data-i18n="role_admin">Администратор</span>
          <span class="role-hint" data-i18n="roleHint">Нажмите, чтобы войти</span>
        </button>

        <!-- Менеджер -->
        <button class="role-card role-manager anim" data-role="manager">
          <span class="role-icon"><i class="fas fa-user-tie"></i></span>
          <span class="role-name" data-i18n="role_manager">Менеджер</span>
          <span class="role-hint" data-i18n="roleHint">Нажмите, чтобы войти</span>
        </button>

        <!-- Преподаватель -->
        <button class="role-card role-teacher anim" data-role="teacher">
          <span class="role-icon"><i class="fas fa-chalkboard-user"></i></span>
          <span class="role-name" data-i18n="role_teacher">Преподаватель</span>
          <span class="role-hint" data-i18n="roleHint">Нажмите, чтобы войти</span>
        </button>

        <!-- Студент -->

          <span class="role-icon"><i class="fas fa-user-graduate"></i></span>
          <span class="role-name" data-i18n="role_student">Студент</span>
          <span class="role-hint" data-i18n="roleHint">Нажмите, чтобы войти</span>
        </button>
      </div>
    </section>

    <!-- ============================================================
         КАРКАС ПАНЕЛИ: Sidebar + Header + Main
         ============================================================ -->
    <section id="panelScreen" class="panel-layout hidden">

      <!-- Затемнение при открытом бургер-меню (только моб.) -->
      <div id="sidebarOverlay" class="sidebar-overlay"></div>

      <!-- БОКОВОЕ МЕНЮ -->
      <aside id="sidebar" class="sidebar">
        <!-- Аватар + имя пользователя (mock) -->

          <div id="sidebarAvatar" class="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div id="sidebarName" class="sidebar-user-name">—</div>
            <div id="sidebarRoleName" class="sidebar-user-role">—</div>
          </div>
        </div>

        <!-- Пункты меню (генерируются функцией renderSidebar) -->
        <nav id="sidebarMenu" class="sidebar-menu"></nav>

        <!-- Выход из панели -->
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-right-from-bracket"></i>
          <span data-i18n="logout">Выйти</span>
        </button>
      </aside>

      <!-- ПРАВАЯ ЧАСТЬ: Header + Main -->
      <div class="panel-right">

        <!-- Верхняя панель внутри приложения -->
        <header class="app-header">
          <!-- Бургер: только на моб./планшете -->
          <button id="burgerBtn" class="burger-btn" aria-label="Меню">
            <i class="fas fa-bars"></i>
          </button>

          <span id="appHeaderTitle" class="app-header-title"></span>

          <div class="app-header-actions">
            <!-- Глобальный поиск (Промт №31) -->
            <div class="search-wrap">
              <button id="searchBtn" class="bell-btn search-btn" data-i18n-title="search" data-i18n-aria-label="search" title="Поиск" aria-label="Поиск">
                <i class="fas fa-magnifying-glass"></i>
              </button>
              <div id="searchDropdown" class="search-dropdown hidden">
                <div class="search-top">
                  <span class="notif-head-title" data-i18n="search">Поиск</span>
                  <button id="searchClose" class="search-close" data-i18n-title="close" data-i18n-aria-label="close" title="Закрыть" aria-label="Закрыть" type="button">

                </div>
                <div id="searchResults" class="search-results"></div>
              </div>
            </div>

            <!-- Колокольчик уведомлений + выпадающая панель (Промт №9) -->

              <button class="lang-btn" data-lang="ru">RU</button>
              <button class="lang-btn" data-lang="en">EN</button>

          <div id="sectionContent"></div>

        <div class="test-top-left">
          <button id="testCloseBtn" class="icon-btn" data-i18n-title="closeTest" title="Закрыть">
            <i class="fas fa-xmark"></i>
          </button>
          <span id="testTitle" class="test-top-title"></span>
        </div>

        <div class="test-top-center">
          <div class="test-progress"><div id="testProgressFill" class="test-progress-fill"></div></div>
          <div id="testQCount" class="test-qcount"></div>
        </div>

        <span id="testTimer" class="test-timer"><i class="fas fa-clock"></i> 45:00</span>
      </header>

      <!-- Тело вопроса -->
      <div class="test-body">
        <h2 id="testQuestionText" class="test-question"></h2>
        <div id="testDiagram" class="test-diagram"></div>
        <div id="testOptions" class="test-options"></div>
      </div>

      <!-- Футер навигации -->

        <button id="testPrevBtn" class="nav-btn" data-i18n="back">Назад</button>
        <button id="testFinishBtn" class="finish-btn" data-i18n="finish">Завершить</button>
        <button id="testNextBtn" class="nav-btn" data-i18n="next">Далее</button>
      </footer>

    </div>
  </div>

    </div>

    function loadManagersFromStorage() {
      try {
        const raw = localStorage.getItem(MANAGERS_KEY);
        if (raw == null) return;
        const saved = JSON.parse(raw);
        if (!Array.isArray(saved) || !saved.length) return;

        const loaded = [];
        saved.forEach((m, index) => {
          if (!m || typeof m !== 'object' || !String(m.name || '').trim()) return;
          loaded.push({
            id: m.id || ('m_' + index + '_' + Date.now()),
            name: String(m.name).trim(),
            direction: m.direction ? String(m.direction) : null
          });
        });
        if (!loaded.length) return;

        mockAllManagers.length = 0;                 // массив const — меняем содержимое
        loaded.forEach(m => mockAllManagers.push(m));

      currentLang = lang;
      localStorage.setItem('unitest_lang', lang);            // сохраняем выбор

    function applyLanguage() {
      const dict = translations[currentLang];
      document.documentElement.lang = currentLang;           // атрибут <html lang>

      // Переводим все элементы с атрибутом data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });

      // Переводим всплывающие подсказки (data-i18n-title)
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (dict[key]) el.title = dict[key];
      });

      // Переводим плейсхолдеры полей (например, «Поиск...»)
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key]) el.placeholder = dict[key];
      });

      // Переводим aria-label (доступность)
      document.querySelectorAll('[data-i18n-aria-label]').forEach(el => {
        const key = el.getAttribute('data-i18n-aria-label');
        if (dict[key]) el.setAttribute('aria-label', dict[key]);
      });

      // Подсвечиваем активную кнопку языка (в шапке входа и в панели)
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);

      document.getElementById('themeTogglePanel').title = dict.switchTheme;

        if (currentSection) navigate(currentSection, false);  // без повторного console.log

      if (activeTest) renderQuestion();

    /* ============================================================
       5.1.1 ГЕЙМИФИКАЦИЯ: БЕЙДЖИ СТУДЕНТА (Промт №32)
       Бейджи не хранятся отдельно — флаги isUnlocked считаются
       из результатов (unitest_results + mockHistoricalResults).
       ============================================================ */
    const mockBadges = [
      { id: "first_test", icon: "fa-flag-checkered", color: "#6366f1",
        titleKey: "badgeFirstTest", descKey: "badgeFirstTestDesc",
        isUnlocked: (results) => results.length >= 1 },
      { id: "excellent", icon: "fa-star", color: "#f59e0b",
        titleKey: "badgeExcellent", descKey: "badgeExcellentDesc",
        isUnlocked: (results) => results.some(r => Number(r.grade) === 5) },
      { id: "active", icon: "fa-fire", color: "#10b981",
        titleKey: "badgeActive", descKey: "badgeActiveDesc",
        isUnlocked: (results) => results.length >= 3 },
      { id: "perfect", icon: "fa-trophy", color: "#ec4899",
        titleKey: "badgePerfect", descKey: "badgePerfectDesc",
        isUnlocked: (results) => results.some(r => Number(r.percent) === 100) }
    ];

    // Исторические результаты принадлежат разным студентам, поэтому
    // к текущему студенту относим только записи с его ФИО.
    function isCurrentStudentResult(result) {
      const name = String((result && result.studentName) || "").toLowerCase();
      if (!name) return false;
      const lastName = String(mockStudent.lastName || "").toLowerCase();
      const firstName = String(mockStudent.firstName || "").toLowerCase();
      return (!!lastName && name.includes(lastName)) || (!!firstName && name.includes(firstName));
    }

    // Результаты текущего студента в едином формате:
    // unitest_results + подходящие записи mockHistoricalResults.
    function getStudentBadgeResults() {
      const saved = getResults();
      const own = (Array.isArray(saved) ? saved : []).map(normalizeResult);
      const historical = (Array.isArray(mockHistoricalResults) ? mockHistoricalResults : [])
        .filter(isCurrentStudentResult)
        .map(normalizeResult);
      return own.concat(historical);
    }

    // Проверяет условия бейджей. Возвращает массив объектов
    // { id, icon, color, titleKey, descKey, isUnlocked }.
    function checkBadges(results) {
      const list = Array.isArray(results) ? results : [];
      const badges = mockBadges.map(badge => {
        let isUnlocked = false;
        try { isUnlocked = !!badge.isUnlocked(list); }
        catch (e) { console.error("Не удалось проверить бейдж:", badge.id, e); }
        console.log("Бейдж", badge.id, "разблокирован?", isUnlocked);
        return {
          id: badge.id, icon: badge.icon, color: badge.color,
          titleKey: badge.titleKey, descKey: badge.descKey, isUnlocked
        };
      });
      if (!list.length) console.log("У студента пока нет достижений");
      return badges;
    }

    // Отрисовывает сетку карточек-бейджей: полученные — цветные,
    // заблокированные — полупрозрачные с замком и подсказкой.
    function renderBadges(results) {
      const dict = translations[currentLang];
      const badges = checkBadges(results);
      const unlockedCount = badges.filter(b => b.isUnlocked).length;

      const cards = badges.map(badge => {
        const title = dict[badge.titleKey] || badge.titleKey;
        const desc = dict[badge.descKey] || badge.descKey;
        const icon = badge.isUnlocked ? badge.icon : "fa-lock";
        const stateClass = badge.isUnlocked ? "badge-card--unlocked" : "badge-card--locked";
        return `
          <article class="badge-card ${stateClass}" data-badge-id="${badge.id}"
                   data-unlocked="${badge.isUnlocked}" style="--badge-color:${badge.color}">
            <div class="badge-icon"><i class="fas ${icon}"></i></div>
            <div class="badge-name">${escapeHtml(title)}</div>
            <div class="badge-desc">${escapeHtml(desc)}</div>
          </article>`;
      }).join("");

      return `
        <section class="badges-section" aria-label="${escapeHtml(dict.badgesTitle)}">
          <div class="badges-head">
            <div class="badges-title"><i class="fas fa-award"></i> ${escapeHtml(dict.badgesTitle)}</div>
            <span class="badges-count">${unlockedCount}/${badges.length}</span>
          </div>
          <div class="badges-grid">${cards}</div>
        </section>`;
    }

    // Возвращает HTML-строку карточки профиля студента.
    // При отсутствии данных — сообщает об ошибке и отдаёт заглушку.
    function renderStudentProfile() {
      const dict = translations[currentLang];

      // Самопроверка №1: данных нет — не рисуем карточку
      if (!mockStudent || typeof mockStudent !== 'object' || Object.keys(mockStudent).length === 0) {
        console.error("Данные студента не загружены!");
        return `
          <div class="content-placeholder">
            <i class="fas fa-triangle-exclamation"></i>
            <span>${dict.dataNotLoaded}</span>
          </div>`;
      }

      const s = mockStudent;
      const fullName = [s.lastName, s.firstName, s.middleName].filter(Boolean).join(" ");
      const initials = ((s.firstName || "?")[0] + (s.lastName || "")[0]).toUpperCase();

      // Значения из справочников переводов (напр. programming → dirProgramming)
      const categoryLabel  = dict["cat" + capitalize(s.category)]  || s.category;
      const directionLabel = dict["dir" + capitalize(s.direction)] || s.direction;
      const formLabel      = s.form === "part" ? dict.formPart : dict.formFull;

      return `
        <div class="profile-card">
          <div class="profile-head">
            <div class="profile-avatar">${initials}</div>
            <div>
              <div class="profile-name">${fullName}</div>
              <span class="category-badge">⭐ ${categoryLabel}</span>
            </div>
          </div>

          <div class="profile-grid">
            <div class="info-item">
              <span class="info-label">${dict.lblCourse}</span>
              <span class="info-value">${s.course} ${dict.courseSuffix}</span>
            </div>
            <div class="info-item">
              <span class="info-label">${dict.lblDirection}</span>
              <span class="info-value">${directionLabel}</span>
            </div>
            <div class="info-item">
              <span class="info-label">${dict.lblGroup}</span>
              <span class="info-value">${s.group}</span>
            </div>
            <div class="info-item">
              <span class="info-label">${dict.lblForm}</span>
              <span class="info-value">${formLabel}</span>
            </div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <i class="fas fa-file-circle-check"></i>
            <div class="stat-value">${studentStats.available}</div>
            <div class="stat-label">${dict.lblAvailable}</div>
          </div>
          <div class="stat-card">
            <i class="fas fa-circle-check"></i>
            <div class="stat-value">${studentStats.passed}</div>
            <div class="stat-label">${dict.lblPassed}</div>
          </div>
          <div class="stat-card">
            <i class="fas fa-star"></i>
            <div class="stat-value">${studentStats.averageGrade}</div>
            <div class="stat-label">${dict.lblAverage}</div>
          </div>
        </div>

        ${renderBadges(getStudentBadgeResults())}`;
    }

    // Вспомогательная: первая буква заглавная (programming → Programming)
    function capitalize(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : "";
    }

    /* ============================================================
       5.2 СПИСОК ТЕСТОВ СТУДЕНТА (Промт №4)
       ============================================================ */
    // Составляет переведённое название теста, напр. «Математика. Контрольная №3»
    function testTitle(test) {
      // Тесты, созданные преподавателем (Промт №14), имеют собственное название
      if (test.title) return test.title;
      const dict = translations[currentLang];
      const subject = dict["subj_" + test.subject] || test.subject;
      return `${subject}. ${dict.controlWork} №${test.num}`;
    }

    // Проверяет, подходит ли тест текущему студенту (курс + направление + группа + форма)
    function isTestMatch(test) {
      const groups = Array.isArray(test.targetGroup) ? test.targetGroup : [test.targetGroup];
      const forms  = Array.isArray(test.targetForm)  ? test.targetForm  : [test.targetForm];
      return test.targetCourse === mockStudent.course
          && test.targetDirection === mockStudent.direction
          && groups.includes(mockStudent.group)
          && forms.includes(mockStudent.form);
    }

    // HTML-карточка одного теста
    function renderTestCard(test, results) {
      const dict = translations[currentLang];
      const passed = results.some(r => r.testId === test.id);   // есть запись в localStorage?
      const icon = SUBJECT_ICONS[test.subject] || "fa-file-lines";

      const statusHTML = passed
        ? `<span class="test-passed"><i class="fas fa-check"></i> ${dict.lblPassed}</span>`
        : `<button class="btn-start" data-test-id="${test.id}">
             <i class="fas fa-play"></i> ${dict.startTest}
           </button>`;

      return `
        <article class="test-card">
          <div class="test-icon"><i class="fas ${icon}"></i></div>
          <h3 class="test-title">${escapeHtml(testTitle(test))}</h3>
          <p class="test-teacher"><i class="fas fa-user-tie"></i> ${test.teacher}</p>

          <div class="test-meta">
            <span class="test-chip"><i class="fas fa-circle-question"></i> ${test.questionsCount} ${dict.questionsWord}</span>
            <span class="test-chip"><i class="fas fa-clock"></i> ${test.timeLimit} ${dict.minWord}</span>
          </div>

          ${test.deadline ? `
          <div class="test-deadline">
            <i class="fas fa-calendar-day"></i> ${dict.lblDeadline}: ${test.deadline}
          </div>` : ''}

          <div class="test-status">${statusHTML}</div>
        </article>`;
    }

    // Рисует список доступных студенту тестов (с фильтрацией и самопроверкой)
    function renderStudentTests() {
      const dict = translations[currentLang];
      const results = getResults();

      // Самопроверка №1
      console.log("Всего тестов в базе:", mockTests.length);

      // Фильтрация: оставляем только подходящие студенту тесты
      const filteredTests = mockTests.filter(test => {
        const isMatch = isTestMatch(test);
        // Самопроверка №2
        console.log("Тест", testTitle(test), "подходит?", isMatch);
        return isMatch;
      });

      // Самопроверка №3
      console.log("Тестов после фильтрации для студента:", filteredTests.length);

      // Самопроверка №4: пусто → красивая заглушка
      if (filteredTests.length === 0) {
        return `
          <div class="content-placeholder">
            <i class="fas fa-inbox"></i>
            <span>${dict.noTests}</span>
          </div>`;
      }

      return `<div class="tests-grid">${filteredTests.map(t => renderTestCard(t, results)).join("")}</div>`;
    }

    // Навешивает обработчики на кнопки «Начать тест»
    function bindStartTestButtons() {
      document.querySelectorAll('#sectionContent .btn-start').forEach(btn => {
        // id может быть числом (демо-тесты) или строкой 'test_...' (Промт №14)
        btn.addEventListener('click', () => startTest(btn.dataset.testId));
      });
    }

    /* ============================================================
       5.6 РАСПИСАНИЕ СТУДЕНТА (Промт №8)
       ============================================================ */
    // HTML одной карточки пары
    function scheduleCard(item) {

    function renderStudentSchedule() {

      console.log("Всего пар в базе:", mockSchedule.length);

    function renderTeacherSchedule() {

    /* ============================================================
       5.7 УВЕДОМЛЕНИЯ И ОБЪЯВЛЕНИЯ (Промт №9)
       ============================================================ */
    // Инициалы автора для аватара ("Smirnov A.A." -> "SA")
    function authorInitials(name) {
      const parts = String(name).trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    // Прочитанные id из localStorage (Промт №30)
    function loadReadNotificationsFromStorage() {
      try {
        const saved = JSON.parse(localStorage.getItem(NOTIF_READ_KEY));
        readNotificationIds = Array.isArray(saved) ? saved.map(String) : [];
      } catch (e) {
        readNotificationIds = [];
        console.error("Не удалось прочитать прочитанные уведомления:", e);
      }
    }

    function saveReadNotifications() {
      try {
        localStorage.setItem(NOTIF_READ_KEY, JSON.stringify(readNotificationIds));
      } catch (e) {
        console.error("Не удалось сохранить прочитанные уведомления:", e);
      }
    }

    // Уведомления только текущей роли (студенческие из №9 + глобальные №30)
    function getRoleNotifications(role) {
      if (!role) return [];
      const own = mockNotifications.filter(n => (n.targetRole || "student") === role);
      const global = mockGlobalNotifications.filter(n => n.targetRole === role);
      return own.concat(global);
    }

    function isNotificationRead(n) {
      return !!n.read || readNotificationIds.includes(String(n.id));
    }

    // Текст уведомления: сначала ключ перевода, потом обычный текст
    function notifField(n, field) {
      const dict = translations[currentLang];
      const key = n[field + "Key"];
      return (key && dict[key]) || n[field] || "";
    }

    // Обновляет красную точку на колокольчике по непрочитанным текущей роли
    function updateBellDot() {
      const dot = document.querySelector('#bellBtn .bell-dot');
      if (!dot) return;
      const unread = getRoleNotifications(currentRole).filter(n => !isNotificationRead(n)).length;
      dot.style.display = unread > 0 ? 'block' : 'none';
    }

    // Есть ли у уведомления подробности (новость/событие) → по нему можно кликать
    function hasNotifDetails(n) { return !!(n && n.details); }

    // HTML одного уведомления в выпадающей панели
    function notifItem(n) {
      const dict = translations[currentLang];
      const clickable = hasNotifDetails(n);
      return `
        <div class="notif-item${isNotificationRead(n) ? '' : ' unread'}${clickable ? ' notif-item--link' : ''}"
             ${clickable ? `data-notif-id="${n.id}" role="button" tabindex="0"` : ''}>
          <div class="notif-item-top">
            <span class="notif-item-title">${escapeHtml(notifField(n, "title"))}</span>
            <span class="notif-item-date">${formatDate(n.date)}</span>
          </div>
          <p class="notif-item-text">${escapeHtml(notifField(n, "text"))}</p>
          ${clickable ? `<span class="notif-item-more">${dict.details} <i class="fas fa-chevron-right"></i></span>` : ''}
        </div>`;
    }

    // HTML «строки последних новостей» вверху панели
    function notifNewsLine(n) {
      return `
        <button type="button" class="notif-news${isNotificationRead(n) ? '' : ' unread'}" data-notif-id="${n.id}">
          <span class="notif-news-text">${escapeHtml(notifField(n, "title"))}</span>
          <i class="fas fa-chevron-right notif-news-arrow"></i>
        </button>`;
    }

    // Рисует панель уведомлений: 1 строка последних новостей + до 3 остальных
    function renderNotifications() {
      const dict = translations[currentLang];
      const list = document.getElementById('notifList');
      if (!list) return;
      if (!currentRole) { list.innerHTML = ""; return; }

      // Только уведомления текущей роли (Промт №30), новые сверху
      const sorted = getRoleNotifications(currentRole)
        .slice()
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const unread = sorted.filter(n => !isNotificationRead(n));

      // Самопроверка №1: сколько уведомлений у текущей роли
      console.log("Уведомления для роли", currentRole, ":", sorted.length);

      // «Отметить все как прочитанные» показываем только при наличии непрочитанных
      const readAllBtn = document.getElementById('notifReadAll');
      if (readAllBtn) readAllBtn.classList.toggle('hidden', unread.length === 0);

      // Самое свежее уведомление с подробностями выносим в «строку новостей»
      const featured = sorted.find(hasNotifDetails) || null;
      const rest = sorted.filter(n => n !== featured).slice(0, 3);

      const parts = [];
      if (featured) {
        parts.push(`<div class="notif-section-label">${dict.latestNews}</div>`);
        parts.push(notifNewsLine(featured));
      }
      if (rest.length) {
        parts.push(rest.map(notifItem).join(""));
      } else if (!featured) {
        parts.push(`<div class="notif-empty">${dict.noNotifications}</div>`);
      }
      list.innerHTML = parts.join("");
    }

    // Находит уведомление по id (id из dataset приходит строкой)
    function findNotification(id) {
      return mockNotifications.concat(mockGlobalNotifications)
        .find(n => String(n.id) === String(id)) || null;
    }

    // HTML содержимого модального окна: статья (news) или подробности (event)
    function notifDetailHTML(n) {
      const dict = translations[currentLang];
      const d = n.details || {};
      const isEvent = n.type === "event" || d.tag === "event";
      const metaParts = [];
      if (d.author) {
        metaParts.push(d.role ? `${d.author} • ${dict["role_" + d.role] || d.role}` : d.author);
      }
      metaParts.push(formatDate(n.date));

      const facts = [];
      if (isEvent) {
        if (d.when)  facts.push(`<div class="notif-fact"><span>${dict.when}</span><b>${d.when}</b></div>`);
        if (d.place) facts.push(`<div class="notif-fact"><span>${dict.place}</span><b>${d.place}</b></div>`);
      }

      const body = (Array.isArray(d.body) && d.body.length ? d.body : [notifField(n, "text")])
        .map(p => `<p>${p}</p>`).join("");

      return `
        <h2 class="notif-article-title">${escapeHtml(notifField(n, "title"))}</h2>
        <div class="notif-article-meta">${metaParts.join(" • ")}</div>
        ${facts.length ? `<div class="notif-facts">${facts.join("")}</div>` : ''}
        <div class="notif-article-text">${body}</div>
        ${d.source ? `<div class="notif-source">${dict.sourceLabel}: ${d.source}</div>` : ''}`;
    }

    // Открывает модальное окно с подробностями (только news/event — у них есть details)
    function openNotifDetail(id) {
      const n = findNotification(id);
      if (!hasNotifDetails(n)) return;               // простые уведомления не открываются
      const modal = document.getElementById('notifModal');
      const box = document.getElementById('notifModalBody');
      if (!modal || !box) return;
      box.innerHTML = notifDetailHTML(n);
      modal.classList.remove('hidden');
      currentNotifId = n.id;
      closeNotifications();                          // закрываем выпадашку
      console.log("Открыты подробности уведомления:", notifField(n, "title"));   // самопроверка №4
    }

    // Закрывает модальное окно с подробностями
    function closeNotifDetail() {
      const modal = document.getElementById('notifModal');
      if (modal) modal.classList.add('hidden');
      currentNotifId = null;
    }

    // Помечает все уведомления ТЕКУЩЕЙ роли прочитанными и запоминает id (Промт №30)
    function markAllRead() {
      if (!currentRole) return;
      const items = getRoleNotifications(currentRole);
      const unreadIds = items.filter(n => !isNotificationRead(n)).map(n => n.id);

      items.forEach(n => { n.read = true; });
      const ids = new Set(readNotificationIds);
      items.forEach(n => ids.add(String(n.id)));
      readNotificationIds = Array.from(ids);
      saveReadNotifications();

      // Самопроверка №2: что именно отмечено и сохранилось
      console.log("Отмечены прочитанными уведомления:", unreadIds);
      updateBellDot();
      renderNotifications();
    }

    // Открывает/закрывает выпадающую панель уведомлений
    function toggleNotifications() {
      const dd = document.getElementById('notifDropdown');
      if (!dd) return;
      const willOpen = dd.classList.contains('hidden');

      if (willOpen) {
        // Панель поиска и уведомления не должны быть открыты одновременно
        closeSearch();
        renderNotifications();
        const unreadCount = getRoleNotifications(currentRole).filter(n => !isNotificationRead(n)).length;
        console.log("Уведомления открыты. Роль:", currentRole, "| Непрочитанных:", unreadCount);
        dd.classList.remove('hidden');
      } else {
        dd.classList.add('hidden');
      }
    }

    // Закрывает выпадающую панель
    function closeNotifications() {
      const dd = document.getElementById('notifDropdown');
      if (dd) dd.classList.add('hidden');
    }

    /* ============================================================
       5.6.2 ГЛОБАЛЬНЫЙ ПОИСК (Промт №31)
       ============================================================ */
    // targetGroup теста может быть строкой или массивом — приводим к массиву строк
    function searchTestGroups(test) {
      const raw = test && test.targetGroup;
      const list = Array.isArray(raw) ? raw : [raw];
      return list.filter(Boolean).map(String);
    }

    // Данные, доступные текущей роли. Студент видит только свои тесты и объявления,
    // преподаватель — свои тесты/группы/студентов, менеджер — своё направление,
    // администратор — всю базу.
    function getSearchScope(role) {
      const scope = { tests: [], groups: [], users: [], announcements: [] };
      if (!role) return scope;

      const asStudent = (s) => ({
        id: s.id, name: s.name || "", role: "student",
        extra: s.group || "", extraKind: "group"
      });
      const asTeacher = (t) => ({
        id: t.id, name: t.name || "", role: "teacher",
        extra: t.subject || "", extraKind: "subject"
      });

      if (role === "student") {
        scope.tests = mockTests.filter(isTestMatch);
        scope.announcements = getAnnouncements().filter(a =>
          !a.targetGroup || a.targetGroup === "all" || a.targetGroup === mockStudent.group);
        return scope;
      }

      if (role === "teacher") {
        const myGroups = getMyGroups();
        const groupNames = myGroups.map(g => g.name);
        scope.tests = mockTests.filter(t => t.author === mockTeacher.name);
        scope.groups = myGroups;
        scope.users = mockAllStudents.filter(s => groupNames.includes(s.group)).map(asStudent);
        scope.announcements = getAnnouncements().filter(a => a.author === mockTeacher.name);
        return scope;
      }

      if (role === "manager") {
        const groups = getManagerGroups();
        const groupNames = groups.map(g => g.name);
        const teacherNames = managerTeacherNames();
        const teacherIds = [...new Set(groups.map(g => g.teacherId))];
        scope.tests = mockTests.filter(t => {
          const names = searchTestGroups(t);
          return teacherNames.includes(t.author) || names.some(n => groupNames.includes(n));
        });
        scope.groups = groups;
        scope.users = mockAllStudents.filter(s => groupNames.includes(s.group)).map(asStudent)
          .concat(mockAllTeachers.filter(t => teacherIds.includes(t.id)).map(asTeacher));
        scope.announcements = getAnnouncements().filter(a =>
          !a.targetGroup || a.targetGroup === "all" || groupNames.includes(a.targetGroup));
        return scope;
      }

      // admin — вся база
      scope.tests = mockTests.slice();
      scope.groups = mockTeacherGroups.slice();
      scope.users = getAdminAllUsers().map(u => ({ ...u }));
      scope.announcements = getAnnouncements().slice();
      return scope;
    }

    // HTML одного результата. Пользовательский текст экранируется.
    function searchResultItem(item) {
      return `
        <button type="button" class="search-result" data-search-label="${escapeHtml(item.title)}">
          <span class="search-result-icon search-result-icon--${item.kind}"><i class="fas ${item.icon}"></i></span>

          </span>

    }

    // HTML категории результатов (пустые категории не рисуем)
    function searchCategoryHTML(label, items) {
      if (!items.length) return "";
      return `
        <div class="search-group">
          <div class="search-group-label">${escapeHtml(label)}</div>
          ${items.map(searchResultItem).join("")}
        </div>`;
    }

    function searchTestResult(t) {
      const dict = translations[currentLang];
      const author = t.author || t.teacher || "";
      const count = t.questionsCount || (Array.isArray(t.questions) ? t.questions.length : 0);
      const meta = [author, count ? `${count} ${dict.questionsWord}` : ""].filter(Boolean).join(" • ");
      return { kind: "test", icon: "fa-file-lines", title: testTitle(t), meta };
    }

    function searchGroupResult(g) {
      const dict = translations[currentLang];
      const direction = dict["dir" + capitalize(g.direction)] || g.direction || "";
      const course = g.course ? `${g.course} ${dict.courseSuffix}` : "";
      return {
        kind: "group", icon: "fa-people-group", title: g.name || "",
        meta: [course, direction].filter(Boolean).join(" • ")
      };
    }

    function searchUserResult(u) {
      const dict = translations[currentLang];
      let extra = u.extra || "";
      if (u.extraKind === "subject") extra = dict["subj_" + u.extra] || extra;
      else if (u.extraKind === "direction") extra = dict["dir" + capitalize(u.extra)] || extra;
      const roleLabel = dict["role_" + u.role] || u.role;
      const icon = u.role === "student" ? "fa-user-graduate"
        : u.role === "teacher" ? "fa-chalkboard-user" : "fa-user-tie";
      return {
        kind: u.role, icon, title: u.name || "",
        meta: [roleLabel, extra].filter(Boolean).join(" • ")
      };
    }

    function searchAnnouncementResult(a) {
      const dict = translations[currentLang];
      const target = a.targetGroup === "all" ? dict.annAllGroups : (a.targetGroup || "");
      return {
        kind: "announcement", icon: "fa-bullhorn", title: a.title || "",
        meta: [a.author || "", target].filter(Boolean).join(" • ")
      };
    }

    // Поиск по введённому тексту: нечувствителен к регистру, от 2 символов.
    function performSearch(rawQuery) {
      const dict = translations[currentLang];
      const box = document.getElementById('searchResults');
      if (!box) return;
      const query = String(rawQuery == null ? "" : rawQuery).trim();
      console.log("Поиск по запросу:", query, "Роль:", currentRole);

      // По одной букве не ищем (самопроверка №2)
      if (query.length < 2) {
        box.innerHTML = `<div class="search-empty"><i class="fas fa-keyboard"></i><span>${dict.searchMinChars}</span></div>`;
        return;
      }

      const q = query.toLowerCase();
      const match = (value) => String(value || "").toLowerCase().includes(q);
      const scope = getSearchScope(currentRole);

      const foundTests = scope.tests
        .filter(t => {
          const subject = dict["subj_" + t.subject] || t.subject || "";
          return match(testTitle(t)) || match(subject) || match(t.author) || match(t.teacher);
        })
        .map(searchTestResult);

      const foundGroups = scope.groups
        .filter(g => {
          const direction = dict["dir" + capitalize(g.direction)] || g.direction || "";
          return match(g.name) || match(g.course) || match(direction);
        })
        .map(searchGroupResult);

      const foundUsers = scope.users
        .filter(u => {
          let extra = u.extra || "";
          if (u.extraKind === "subject") extra = dict["subj_" + u.extra] || extra;
          else if (u.extraKind === "direction") extra = dict["dir" + capitalize(u.extra)] || extra;
          return match(u.name) || match(extra) || match(dict["role_" + u.role]);
        })
        .map(searchUserResult);

      const foundAnnouncements = scope.announcements
        .filter(a => match(a.title) || match(a.text) || match(a.author))
        .map(searchAnnouncementResult);

      // Самопроверка №3: логи по количеству найденного
      console.log("Найдено тестов:", foundTests.length);
      console.log("Найдено пользователей:", foundUsers.length);

      const total = foundTests.length + foundGroups.length + foundUsers.length + foundAnnouncements.length;
      if (!total) {
        box.innerHTML = `
          <div class="search-empty">
            <i class="fas fa-circle-info"></i>
            <span>${dict.searchNothing}: «${escapeHtml(query)}»</span>
          </div>`;
        return;
      }

      box.innerHTML = `
        <div class="search-results-title">${dict.searchResults}</div>
        ${searchCategoryHTML(dict.searchTests, foundTests)}
        ${searchCategoryHTML(dict.searchGroups, foundGroups)}
        ${searchCategoryHTML(dict.searchUsers, foundUsers)}
        ${searchCategoryHTML(dict.searchAnnouncements, foundAnnouncements)}`;
    }

    // Открывает панель поиска и ставит фокус в поле
    function openSearch() {
      const dd = document.getElementById('searchDropdown');
      if (!dd || !currentRole) return;
      closeNotifications();
      dd.classList.remove('hidden');
      const input = document.getElementById('searchInput');
      if (input) {
        input.focus();
        input.select();
      }
      performSearch(input ? input.value : "");
      console.log("Поиск открыт. Роль:", currentRole);
    }

    // Закрывает панель и очищает поле/результаты (Промт №31, п.4)
    function closeSearch() {
      const dd = document.getElementById('searchDropdown');
      if (dd) dd.classList.add('hidden');
      const input = document.getElementById('searchInput');
      if (input) input.value = "";
      const box = document.getElementById('searchResults');
      if (box) box.innerHTML = "";
    }

    function toggleSearch() {
      const dd = document.getElementById('searchDropdown');
      if (!dd) return;
      if (dd.classList.contains('hidden')) openSearch();

    }

    function openTeacherAnnouncementModal() {
      const dict = translations[currentLang];
      let overlay = document.getElementById('teacherAnnOverlay');
      if (!overlay) {
        document.body.insertAdjacentHTML('beforeend', teacherAnnouncementModalHTML());
        overlay = document.getElementById('teacherAnnOverlay');
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay || e.target.closest('#annClose') || e.target.closest('#annCancel')) {
            closeTeacherAnnouncementModal();
            return;
          }
          if (e.target.closest('#annPublish')) publishTeacherAnnouncement();
        });
        document.addEventListener('keydown', (e) => {
          const o = document.getElementById('teacherAnnOverlay');
          if (e.key === 'Escape' && o && !o.classList.contains('hidden')) closeTeacherAnnouncementModal();
        });
      }
      const select = document.getElementById('annGroupSelect');
      if (select) {
        const groups = getMyGroups();
        select.innerHTML = `
          <option value="">— ${dict.annForGroup} —</option>
          <option value="all">${dict.annForAllMyGroups}</option>
          ${groups.map(g => `<option value="${escapeHtml(g.name)}">${escapeHtml(g.name)}</option>`).join("")}`;

      const title = document.getElementById('annTitleInput');
      const text = document.getElementById('annTextInput');
      if (title) title.value = '';
      if (text) text.value = '';
      overlay.classList.remove('hidden');
      if (title) { try { title.focus(); } catch (e) {} }
    }

      const overlay = document.getElementById('teacherAnnOverlay');

    function publishTeacherAnnouncement() {
      const dict = translations[currentLang];
      const titleEl = document.getElementById('annTitleInput');
      const textEl = document.getElementById('annTextInput');
      const groupEl = document.getElementById('annGroupSelect');
      const title = (titleEl ? titleEl.value : '').trim();
      const text = (textEl ? textEl.value : '').trim();
      const targetGroup = groupEl ? groupEl.value : '';

      if (!title || !text) { alert(dict.errAnnFields); return; }
      if (!targetGroup) { alert(dict.errAnnGroup); return; }

      const newAnnouncement = {
        id: Date.now(),
        author: mockTeacher.name,
        role: 'teacher',
        date: new Date().toISOString().slice(0, 10),
        title,
        text,
        targetGroup
      };

      const all = getAnnouncements();
      all.unshift(newAnnouncement);
      mockAnnouncements.length = 0;
      all.forEach(a => mockAnnouncements.push(a));
      saveAnnouncements(all);

      console.log("Объявление создано:", newAnnouncement.title, "Для группы:", newAnnouncement.targetGroup);
      console.log("Всего объявлений в базе:", mockAnnouncements.length);

      closeTeacherAnnouncementModal();
      renderSectionContent();
    }

    // Строит зачётку: считает средний балл, рисует статистику, таблицу и карточки
    function renderStudentTranscript() {
      const dict = translations[currentLang];

      // 1. Преобразуем сохранённые результаты тестов в формат оценок
      const results = getResults();
      const fromResults = results.map(r => {
        const test = mockTests.find(t => t.id === r.testId);
        const grade = (r.grade != null) ? r.grade : r.score;   // совместимость со старым форматом
        return {
          subject: r.testTitle || (test ? testTitle(test) : "—"),
          teacher: test ? test.teacher : "—",
          date: r.date || "",
          grade
        };
      });

      // 2. Фиктивные экзаменационные оценки (переводим ключ предмета)
      const mockGradesLocalized = mockGrades.map(g => ({
        subject: dict["subj_" + g.subject] || g.subject,
        teacher: g.teacher,
        date: g.date,
        grade: g.grade
      }));

      // 3. Итоговый массив
      const allGrades = fromResults.concat(mockGradesLocalized);

      // Самопроверка №1: средний балл (пусто → 0, иначе округление до 2 знаков)
      let averageGrade = 0;
      if (allGrades.length) {
        const sum = allGrades.reduce((acc, g) => acc + (Number(g.grade) || 0), 0);
        averageGrade = Math.round((sum / allGrades.length) * 100) / 100;
      }
      console.log("Всего оценок:", allGrades.length, "Средний балл:", averageGrade);

      // Самопроверка №2: пусто → заглушка
      if (allGrades.length === 0) {
        return `
          <div class="content-placeholder">
            <i class="fas fa-book-open-reader"></i>
            <span>${dict.noGrades}</span>
          </div>`;
      }

      const gradeBadge = (grade) => `<span class="grade-badge grade-badge-${grade}">${grade}</span>`;
      const dateStr = (d) => d ? formatDate(d) : "—";

      // Строки таблицы (десктоп)
      const rows = allGrades.map(g => `
        <tr>
          <td class="tr-subject">${g.subject}</td>
          <td>${g.teacher}</td>
          <td>${dateStr(g.date)}</td>
          <td>${gradeBadge(g.grade)}</td>
        </tr>`).join("");

      // Карточки (мобильный)
      const cards = allGrades.map(g => `
        <div class="grade-card">
          <div class="grade-card-top">
            <span class="grade-card-subject">${g.subject}</span>
            ${gradeBadge(g.grade)}
          </div>
          <div class="grade-card-bottom">
            <span class="grade-card-date"><i class="fas fa-calendar-day"></i> ${dateStr(g.date)}</span>
            <span class="grade-card-teacher">${g.teacher}</span>
          </div>
        </div>`).join("");

      return `
        <div class="transcript-head">
          <h2 class="transcript-title">${dict.gradebook}</h2>
          <button id="exportPdfBtn" class="export-btn"><i class="fas fa-download"></i> ${dict.downloadPdf}</button>
        </div>

        <div class="transcript-stats">
          <div class="stat-card">
            <div class="stat-value">${allGrades.length}</div>
            <div class="stat-label">${dict.lblSubjectsPassed}</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${averageGrade}</div>
            <div class="stat-label">${dict.lblAverage}</div>
          </div>
        </div>

        <div class="transcript-table-wrap">
          <table class="transcript-table">
            <thead>
              <tr>
                <th>${dict.thSubject}</th>
                <th>${dict.thTeacher}</th>
                <th>${dict.thDate}</th>
                <th>${dict.thGrade}</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>

        <div class="grade-cards">${cards}</div>`;
    }

    /* ============================================================
       ПАНЕЛЬ АДМИНИСТРАТОРА: НАСТРОЙКИ И ЖУРНАЛ (Промт №29)

    // Демо-записи журнала. actionKey — ключ перевода шаблона,
    // args — подстановки; строка, начинающаяся с «@», переводится
    // через dict (например, '@dirDesign' → «Дизайн»).
    const mockSystemLogs = [
      { id: 'sl1', time: '10:45', user: mockTeacher.name,
        actionKey: 'adminLogTestCreated', args: ['@adminLogTestMath'] },
      { id: 'sl2', time: '09:30', user: mockAdmin.name,
        actionKey: 'adminLogUserAdded', args: [mockStudent.firstName + ' ' + mockStudent.lastName] },
      { id: 'sl3', time: '09:05', user: mockManager.name,
        actionKey: 'adminLogGroupCreated', args: ['202-DZ'] },

    ];

    // Системные настройки (название вуза, учебный год, язык/тема по умолчанию).
    const DEFAULT_SYSTEM_SETTINGS = {
      university: 'UniTest University',
      academicYear: '2026/2027',
      language: 'ru',
      theme: 'light'
    };
    let systemSettings = { ...DEFAULT_SYSTEM_SETTINGS };
    // Журнал в памяти: при первом запуске — демо-записи, дальше — из localStorage.
    let systemLogs = [];

    // Загружает настройки из localStorage (вызывается в initApp до применения темы/языка).
    function loadAdminSettingsFromStorage() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw == null) return;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return;
        systemSettings = {
          university: typeof saved.university === 'string' && saved.university.trim()
            ? saved.university : DEFAULT_SYSTEM_SETTINGS.university,
          academicYear: typeof saved.academicYear === 'string' && saved.academicYear.trim()
            ? saved.academicYear : DEFAULT_SYSTEM_SETTINGS.academicYear,
          language: ['ru', 'uz', 'en'].includes(saved.language) ? saved.language : DEFAULT_SYSTEM_SETTINGS.language,
          theme: saved.theme === 'dark' ? 'dark' : 'light'
        };
        console.log("Системные настройки восстановлены:", systemSettings);
      } catch (e) {
        console.error("Не удалось прочитать системные настройки:", e);
        systemSettings = { ...DEFAULT_SYSTEM_SETTINGS };
      }
    }

    function saveAdminSettingsToStorage() {
      const dict = translations[currentLang];
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(systemSettings));
        return true;
      } catch (e) {
        console.error("Не удалось сохранить системные настройки:", e);
        alert(dict.storageFull || "Не хватает места в localStorage");
        return false;
      }
    }

    // Загружает журнал: если ключа нет — показываем демо-записи,
    // если сохранён пустой массив — журнал остаётся пустым.
    function loadAuditLogsFromStorage() {
      try {
        const raw = localStorage.getItem(AUDIT_KEY);
        if (raw == null) {
          systemLogs = mockSystemLogs.map(entry => ({ ...entry, args: (entry.args || []).slice() }));
          return;
        }
        const saved = JSON.parse(raw);
        systemLogs = Array.isArray(saved) ? saved.filter(e => e && typeof e === 'object') : [];
      } catch (e) {
        console.error("Не удалось прочитать журнал действий:", e);
        systemLogs = mockSystemLogs.map(entry => ({ ...entry, args: (entry.args || []).slice() }));
      }
    }

    function saveAuditLogsToStorage() {
      try {
        localStorage.setItem(AUDIT_KEY, JSON.stringify(systemLogs));
        return true;
      } catch (e) {
        console.error("Не удалось сохранить журнал действий:", e);
        return false;
      }
    }

    // Дописывает запись в журнал (новые — сверху) и сохраняет его.
    function addSystemLog(user, actionKey, args = []) {
      const now = new Date();
      const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const entry = {
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        time,
        user: user || mockAdmin.name,
        actionKey,
        args: args.slice()
      };
      systemLogs.unshift(entry);
      if (systemLogs.length > 50) systemLogs.length = 50;
      saveAuditLogsToStorage();
      return entry;
    }

    // Текст записи журнала: шаблон из dict + подстановки (с поддержкой @-ключей).
    function systemLogText(entry) {
      const dict = translations[currentLang];
      const template = dict[entry.actionKey] || entry.actionKey || '';
      const args = (Array.isArray(entry.args) ? entry.args : []).map(arg => {
        const value = String(arg == null ? '' : arg);
        return value.charAt(0) === '@' ? (dict[value.slice(1)] || value.slice(1)) : value;
      });
      return template.replace(/\{(\d+)\}/g, (match, index) => {
        const value = args[Number(index)];
        return value != null ? value : '';
      });
    }

    // Название направления по ключу (programming → dirProgramming)
    function adminDirectionLabel(direction) {
      const dict = translations[currentLang];
      return dict["dir" + capitalize(direction)] || direction;
    }

    // Текст одного события ленты: шаблон из dict + подставленные данные
    function adminEventText(event) {
      const dict = translations[currentLang];
      const actor = escapeHtml(event.actor || "");
      if (event.type === 'testCreated') {
        const subject = dict["subj_" + event.subject] || event.subject || "";
        return dict.adminEventTestCreated.replace("{0}", actor).replace("{1}", escapeHtml(subject));
      }
      if (event.type === 'groupAdded') {
        return dict.adminEventGroupAdded.replace("{0}", actor).replace("{1}", escapeHtml(event.group || ""));
      }
      if (event.type === 'testPassed') {
        return dict.adminEventTestPassed.replace("{0}", actor).replace("{1}", String(event.grade != null ? event.grade : ""));
      }
      return "";
    }

    /* ============================================================
       ПАНЕЛЬ АДМИНИСТРАТОРА: СПИСОК ПОЛЬЗОВАТЕЛЕЙ (Промт №24)
       ============================================================ */
    // Единый список пользователей: студенты + преподаватели + менеджеры.
    // role — ключ перевода (role_student / role_teacher / role_manager), а не русская строка.
    // extraKind определяет, как переводить «Доп. информацию»:
    //   group — номер группы студента (как есть, '101-PR');
    //   subject — ключ предмета (subj_math → «Математика»);
    //   direction — ключ направления (dirProgramming → «Программирование»).
    let allUsers = [];

    function getAdminAllUsers() {
      const students = (Array.isArray(mockAllStudents) ? mockAllStudents : []).map(s => ({
        id: s.id,
        name: s.name || "",
        role: 'student',
        extra: s.group || "",
        extraKind: 'group'
      }));
      const teachers = (Array.isArray(mockAllTeachers) ? mockAllTeachers : []).map(t => ({
        id: t.id,
        name: t.name || "",
        role: 'teacher',
        extra: t.subject || "",
        extraKind: 'subject'
      }));
      const managers = (Array.isArray(mockAllManagers) ? mockAllManagers : []).map(m => ({
        id: m.id,
        name: m.name || "",
        role: 'manager',
        extra: m.direction || "",
        extraKind: 'direction'
      }));

      return [...students, ...teachers, ...managers];
    }

    // Подпись роли: всегда из переводов (без хардкода).
    function adminUserRoleLabel(user) {
      const dict = translations[currentLang];
      return dict['role_' + user.role] || user.role;
    }

    // «Доп. информация»: группа / переведённый предмет / переведённое направление.
    function adminUserExtraLabel(user) {
      const dict = translations[currentLang];
      if (user.extraKind === 'subject') return dict['subj_' + user.extra] || user.extra;
      if (user.extraKind === 'direction') return dict['dir' + capitalize(user.extra)] || user.extra;
      return user.extra;
    }

    function adminUserRowHTML(user) {
      const roleIcon = user.role === 'student' ? 'fa-user-graduate'

    // Поиск + фильтр по роли работают вместе.
    function filterUsers() {
      const dict = translations[currentLang];
      const searchEl = document.getElementById('adminUserSearch');
      const roleEl = document.getElementById('adminUserRole');
      const query = (searchEl ? searchEl.value : '').trim().toLowerCase();
      const role = roleEl ? roleEl.value : '';

      const filteredUsers = allUsers.filter(user =>
        (!role || user.role === role) &&
        (user.name || '').toLowerCase().includes(query)
      );
      console.log("Отфильтровано пользователей:", filteredUsers.length);

      const rowsEl = document.getElementById('adminUsersRows');
      const cardsEl = document.getElementById('adminUsersCards');
      if (!rowsEl || !cardsEl) return filteredUsers;

      if (!filteredUsers.length) {
        rowsEl.innerHTML = `<tr><td colspan="4">
          <div class="content-placeholder">
            <i class="fas fa-user-slash"></i>
            <span>${dict.adminUsersNotFound}</span>
          </div>
        </td></tr>`;
        cardsEl.innerHTML = `<div class="content-placeholder">
          <i class="fas fa-user-slash"></i>
          <span>${dict.adminUsersNotFound}</span>
        </div>`;
        return filteredUsers;
      }

      rowsEl.innerHTML = filteredUsers.map(adminUserRowHTML).join("");
      cardsEl.innerHTML = filteredUsers.map(adminUserCardHTML).join("");
      return filteredUsers;
    }
