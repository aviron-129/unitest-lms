    function renderQuestionList() {
      const dict = translations[currentLang];
      const list = document.getElementById('qList');
      if (!currentTestDraft || !currentTestDraft.questions || currentTestDraft.questions.length === 0) {
        list.innerHTML = `<div class="q-list-empty">${dict.qListEmpty}</div>`;
        return;
      }
      const letters = ['A','B','C','D'];
      list.innerHTML = currentTestDraft.questions.map((q, idx) => `
        <div class="q-item">
          <div class="q-item-head">
            <div class="q-item-text"><span class="q-item-num">№${idx+1}.</span> ${String(q.text).replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
            ${q.diagram ? `<button type="button" class="q-diagram-edit" data-diagram-idx="${idx}" title="${dict.diagramEditTitle}">📐</button>` : ''}
            <button type="button" class="q-delete" data-idx="${idx}" title="${dict.btnDelete}"><i class="fas fa-trash"></i></button>
          </div>
          ${renderQuestionDiagram(q)}
          <div class="q-item-opts">
            ${letters.map((L,i)=>`<div class="q-item-opt${Number(q.correct)===i?' is-correct':''}"><i class="fas ${Number(q.correct)===i?'fa-check-circle':'fa-circle'}"></i><span>${L}. ${String(q.options[i]||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`).join('')}
          </div>
        </div>`).join('');
      list.querySelectorAll('.q-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteQuestion(Number(btn.dataset.idx)));
      });
      list.querySelectorAll('.q-diagram-edit').forEach(btn => {
        btn.addEventListener('click', () => openDiagramModal(Number(btn.dataset.diagramIdx)));
      });

      // Предпросмотр вопроса: рендер формул ($...$)
      renderMath(list);
    }

    // Обновляет заголовок («Добавлено: X из Y»), зелёное уведомление,
    // кнопку «Добавить вопрос» и список предпросмотра. Единая точка обновления UI.
    function updateQuestionBuilderState() {
      if (!currentTestDraft) return;
      const dict = translations[currentLang];
      const added = currentTestDraft.questions.length;
      const total = currentTestDraft.questionsCount;
      const limitReached = total > 0 && added >= total;

      // Счётчик в заголовке карточки
      const titleEl = document.querySelector('.qb-screen .form-card-title');
      if (titleEl) {
        titleEl.innerHTML =
          `<i class="fas fa-circle-plus"></i> ${dict.addQuestionTitle.replace('{0}', String(added)).replace('{1}', String(total))}`;
      }

      // Зелёное уведомление «Все вопросы добавлены!» + блокировка кнопки
      const done = document.getElementById('qbDone');
      if (done) done.classList.toggle('is-visible', limitReached);
      const addBtn = document.getElementById('qbAdd');
      if (addBtn) addBtn.disabled = limitReached;

      renderQuestionList();
    }

    function deleteQuestion(idx) {
      if (!currentTestDraft) return;
      currentTestDraft.questions.splice(idx, 1);
      console.log("Вопрос удалён. Всего вопросов:", currentTestDraft.questions.length);
      updateQuestionBuilderState();          // счётчик и уведомление пересчитываются
    }

    function addQuestionToDraft() {
      const dict = translations[currentLang];

      // 1. Текст вопроса обязателен
      const textEl = document.getElementById('qText');
      const qText = textEl.value.trim();
      if (!qText) {
        alert(dict.errEmptyQuestion);
        textEl.focus();
        return;
      }

      // 2. Все 4 варианта ответов обязательны
      const opts = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i).value.trim());
      if (opts.some(o => o === '')) {
        alert(dict.errEmptyOptions);
        return;
      }

      // 3. Правильный вариант должен быть отмечен радио-кнопкой
      const checked = document.querySelector('input[name="qCorrect"]:checked');
      if (!checked) {
        alert(dict.errNoCorrect);
        return;
      }

      // Всё заполнено → сохраняем вопрос только в черновик (не в mockTests!)
      currentTestDraft.questions.push({
        text: qText,
        options: [opts[0], opts[1], opts[2], opts[3]],
        correct: Number(checked.value),
        diagram: pendingDiagram ? JSON.parse(JSON.stringify(pendingDiagram)) : null
      });

      console.log("Вопрос добавлен. Всего вопросов:", currentTestDraft.questions.length);
      console.log("Текущий черновик:", currentTestDraft);

      // Очищаем форму под следующий вопрос
      textEl.value = '';
      pendingDiagram = null;
      renderPendingDiagram();
      const liveField = document.getElementById('qTextLive');
      const liveVisible = liveField && liveField.style.display !== 'none';
      if (liveVisible) { try { liveField.value = ''; } catch (e) {} }
      [0, 1, 2, 3].forEach(i => {
        document.getElementById('qOpt' + i).value = '';
        document.getElementById('qCorr' + i).checked = false;
      });

      updateQuestionBuilderState();
      if (liveVisible) { try { liveField.focus(); } catch (e) {} } else textEl.focus();
    }

    // Обработчики конструктора вопросов (Промт №13)
    function bindQuestionBuilder() {
      if (!currentTestDraft) return;
      if (!currentTestDraft.questions) currentTestDraft.questions = [];

      // Первичное состояние: список, счётчик, уведомление, кнопка
      updateQuestionBuilderState();

      bindFormulaToolbars(document.getElementById('sectionContent'));   // панель формул (LaTeX/химия)
      bindMathPreviews(document.getElementById('sectionContent'));      // живой предпросмотр формул
      // MathLive (готовый WYSIWYG-редактор + клавиатура); если CDN не загрузился — старый Math Pad
      if (!bindMathLiveEditor(document.getElementById('sectionContent'))) {
        bindMathPad(document.getElementById('sectionContent'));
      }
      bindDiagramEditor(document.getElementById('sectionContent'));     // кнопка 📐 Схема

      // «Добавить вопрос» → валидация + сохранение в currentTestDraft.questions
      const addBtn = document.getElementById('qbAdd');
      if (addBtn) addBtn.addEventListener('click', addQuestionToDraft);

      // «Назад к настройкам» → возврат к форме шага 1
      const backBtn = document.getElementById('qbBack');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          const box = document.getElementById('sectionContent');
          box.innerHTML = renderCreateTestForm();
          bindCreateTestForm();
        });
      }

      // «Завершить создание» → сохранение теста в базу + переход в «Мои тесты» (Промт №14)
      const finishBtn = document.getElementById('qbFinish');
      if (finishBtn) {
        finishBtn.addEventListener('click', saveTestToDB);
      }
    }

    /* ============================================================
       5.10.1 СОХРАНЕНИЕ ТЕСТА В БАЗУ (Промт №14)
       ============================================================ */
    // Демо-дедлайн нового теста: +14 дней от сегодняшнего дня (в формате Date)
    function defaultDeadline() {
      const d = new Date();
      d.setDate(d.getDate() + 14);
      return d;
    }

    // Сохраняет currentTestDraft в mockTests (+localStorage) и открывает «Мои тесты».
    // ВАЖНО (самопроверка №4): target*-поля маппингаются из настроек шага 1 так же,
    // как их проверяет фильтр студента isTestMatch(): курс, направление, группы, форма.
    function saveTestToDB() {
      if (!currentTestDraft) {
        console.error("saveTestToDB: черновик теста пуст — сохранять нечего");
        return;
      }

      console.log("Сохранение теста:", currentTestDraft.title);

      // Направление теста берём из первой выбранной группы (в mockTeacherGroups у
      // каждой группы есть direction). Без targetDirection тест не пропустил бы
      // фильтр студента isTestMatch() — он обязан совпадать с направлением студента.
      const firstGroup = mockTeacherGroups.find(g => g.name === currentTestDraft.groups[0]);

      const newTest = {
        id: 'test_' + Date.now(),                          // уникальный id (строка)
        subject: currentTestDraft.subject,                 // ключ перевода (subj_math)
        title: currentTestDraft.title,                     // собственное название теста
        teacher: mockTeacher.name,                         // имя — в карточке студента
        author: mockTeacher.name,                          // фильтр раздела «Мои тесты»
        status: 'active',
        questionsCount: currentTestDraft.questionsCount,
        questions: currentTestDraft.questions,             // вопросы из конструктора (шаг 2)
        timeLimit: currentTestDraft.timeLimit,
        deadline: formatDate(defaultDeadline()),           // демо-срок: +14 дней (DD.MM.YYYY)
        access: currentTestDraft.access,                   // all | archer
        // Кому назначен тест (маппинг из настроек шага 1):
        targetCourse: currentTestDraft.course,             // курс
        targetDirection: firstGroup ? firstGroup.direction : mockStudent.direction,
        targetGroup: currentTestDraft.groups,              // массив групп (как выбрал преподаватель)
        // Форма обучения: 'both' → ['full','part'], иначе скаляр 'full' | 'part'
        targetForm: currentTestDraft.form === 'both' ? ['full', 'part'] : currentTestDraft.form
      };

      mockTests.push(newTest);
      saveTestsToStorage();                                // localStorage: unitestalltests

      console.log("Всего тестов в базе после сохранения:", mockTests.length);

      currentTestDraft = null;                             // черновик больше не нужен
      navigate('myTests');                                 // переход в раздел «Мои тесты»
    }

    /* ============================================================
       5.11 РАЗДЕЛ «МОИ ТЕСТЫ» ПРЕПОДАВАТЕЛЯ (Промт №14)
       ============================================================ */
    // Экранирует спецсимволы HTML (пользовательский ввод названий/вопросов)
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Рендер математических формул (LaTeX) внутри элемента: $...$ и $$...$$.
    // KaTeX подключён defer с CDN, поэтому вызываем renderMathInElement только если
    // библиотека уже загрузилась (иначе — тихо пропускаем, текст остаётся как есть).
    function renderMath(element) {
      if (!element || typeof renderMathInElement !== 'function') return;
      try {
        renderMathInElement(element, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false   // одна битая формула → красная подсказка KaTeX,
                                // но НЕ срывает рендер остальных формул на экране
        });
      } catch (e) {
        console.error("Ошибка рендера формул:", e);
      }
    }

    /* ============================================================
       5.11.0.1 КОНСТРУКТОР ФОРМУЛ: ПАНЕЛЬ КНОПОК + ТАБЛИЦА МЕНДЕЛЕЕВА
       (задача пользователя: «неудобно писать формулы»)
       ============================================================ */
    // Кнопки панели: подпись → LaTeX-шаблон ГОТОВОЙ формулы в разделителях $...$.
    // Без $...$ KaTeX не распознает математику и на экранах остаётся сырой текст
    // (\infty, \sum, \leq) — поэтому каждый шаблон самодостаточен и целиком в $...$.
    // Курсор встаёт: внутрь первой пустой пары {} → внутрь ( ) → в конец после $.
    const FORMULA_SNIPPETS = [
      { l: "x²",  s: "$x^2$" },
      { l: "xₙ",  s: "$x_{}$" },
      { l: "a/b", s: "$\\frac{}{}$" },
      { l: "√",   s: "$\\sqrt{}$" },
      { l: "∫",   s: "$\\int_{}^{}$" },
      { l: "∑",   s: "$\\sum_{}^{}$" },
      { l: "∏",   s: "$\\prod_{}^{}$" },
      { l: "lim", s: "$\\lim_{x \\to }$" },
      { l: "∞",   s: "$\\infty$" },
      { l: "±",   s: "$\\pm$" },
      { l: "·",   s: "$\\cdot$" },
      { l: "×",   s: "$\\times$" },
      { l: "≠",   s: "$\\neq$" },
      { l: "≤",   s: "$\\leq$" },
      { l: "≥",   s: "$\\geq$" },
      { l: "≈",   s: "$\\approx$" },
      { l: "∈",   s: "$\\in$" },
      { l: "→",   s: "$\\to$" },
      { l: "⇔",   s: "$\\Leftrightarrow$" },
      { l: "( )", s: "$\\left( \\right)$" },
      { l: "[ ]", s: "$\\left[ \\right]$" },
      { l: "θ",   s: "$\\theta$" },
      { l: "α",   s: "$\\alpha$" },
      { l: "β",   s: "$\\beta$" },
      { l: "π",   s: "$\\pi$" },
      { l: "σ",   s: "$\\sigma$" },
      { l: "ω",   s: "$\\omega$" },
      { l: "Δ",   s: "$\\Delta$" },
      { l: "H₂O", s: "$\\ce{}$", chem: true },
      { l: "⟶",   s: "$\\ce{->}$" },
      { l: "⇌",   s: "$\\ce{<=>}$" }
    ];

    // HTML панели. target: id поля ('ctName'/'qText') или 'options' —
    // тогда вставляем в поле варианта, в котором сейчас стоит курсор
    function formulaBarHTML(target) {
      const dict = translations[currentLang];
      const buttons = FORMULA_SNIPPETS.map(b =>
        `<button type="button" class="fb-btn" data-snippet="${b.s}"
           title="${b.chem ? dict.fbChem : b.l}">${b.l}</button>`).join("");
      return `
        <div class="formula-bar" data-target="${target}" role="toolbar" aria-label="${dict.fbBar}">
          ${buttons}
          <button type="button" class="fb-btn fb-pt" title="${dict.ptTitle}"
                  aria-label="${dict.ptTitle}">🧪</button>
        </div>`;
    }

    // Вставляет шаблон (уже в $...$) в поле на место курсора.
    // Если курсор УЖЕ внутри $...$ / $$...$$ — вставляется «голое» тело шаблона
    // без $-обёртки, иначе двойной клик порождал битую вложенность
    // вида $\frac{$\frac{}{}$}{}$ (KaTeX его не понимал → сырые символы в предпросмотре).
    // Курсор ставится ВНУТРИ формулы: первая пустая пара {} → внутрь ( ) →
    // в конец после закрывающего $.
    function insertFormulaSnippet(field, snippet) {
      if (!field) return;
      const start = (typeof field.selectionStart === "number") ? field.selectionStart : field.value.length;
      const end = (typeof field.selectionEnd === "number") ? field.selectionEnd : start;
      let text = snippet;
      if (text.length > 2 && text.charAt(0) === "$" && text.charAt(text.length - 1) === "$"
          && insideMath(field.value, start)) {
        text = text.slice(1, -1);                        // уже внутри математики → вставляем без $...$
      }
      field.value = field.value.slice(0, start) + text + field.value.slice(end);
      const brace = text.indexOf("{}");
      const open = text.indexOf("(");
      const close = text.indexOf(")");
      let caret;
      if (brace !== -1) caret = start + brace + 1;        // \frac{|}{}, \int_{|}^{}, \ce{|}
      else if (open !== -1 && close > open) caret = start + open + 1;  // \left(| \right)
      else caret = start + text.length;                   // в конец (после закрывающего $)
      try { field.setSelectionRange(caret, caret); } catch (e) { /* у части полей.setSelectionRange недоступен */ }
      field.focus();
      syncMathPreview(field);      // живой предпросмотр обновляется мгновенно (без события input)
    }

    // Истинно, если позиция pos находится внутри математического региона $...$ или $$...$$
    function insideMath(value, pos) {
      let inside = false, i = 0;
      while (i < pos && i < value.length) {
        if (value.charAt(i) === "\\" && value.charAt(i + 1) === "$") { i += 2; continue; } // \$ — литерал
        if (value.substr(i, 2) === "$$") { inside = !inside; i += 2; continue; }
        if (value.charAt(i) === "$") inside = !inside;
        i++;
      }
      return inside;
    }

    // Поле варианта ответа, в которое вставляются кнопки панели «варианты» (последний фокус)
    let activeFormulaField = null;

    // Навешивает делегирование кликов на все панели внутри root (шаг 1 + конструктор)
    function bindFormulaToolbars(root) {
      if (!root) return;
      root.querySelectorAll('.formula-bar').forEach(bar => {
        bar.addEventListener('click', (e) => {
          // 🧪 — таблица Менделеева
          if (e.target.closest('.fb-pt')) {
            e.preventDefault();
            const fixed = bar.dataset.target;
            openPeriodicTable(fixed && fixed !== 'options'
              ? document.getElementById(fixed)
              : (activeFormulaField || document.getElementById('qOpt0')));
            return;
          }
          const btn = e.target.closest('[data-snippet]');
          if (!btn) return;
          e.preventDefault();                              // не даём кнопке увести фокус
          const fixed = bar.dataset.target;
          insertFormulaSnippet(
            fixed && fixed !== 'options'
              ? document.getElementById(fixed)
              : (activeFormulaField || document.getElementById('qOpt0')),
            btn.dataset.snippet);
        });
      });
      // Панель «варианты»: запоминаем, в какое поле сейчас пишут
      root.querySelectorAll('.q-opt-input').forEach(inp => {
        inp.addEventListener('focus', () => { activeFormulaField = inp; });
      });
    }

    /* ============================================================
       5.11.0.2 ЖИВОЙ ПРЕДПРОСМОТР ФОРМУЛ (LIVE PREVIEW)
       Преподаватель видит отрендеренную формулу сразу при вводе,
       не дожидаясь сохранения. Три режима:
       — значение с $...$ / $$...$$ → тот же путь, что на экранах теста (renderMath);
       — «голый» LaTeX без $ (\ce{H2O}, x^2) → katex.render, displayMode;
       — обычный текст или KaTeX не загружен (офлайн/CDN) → текст как есть.
       ============================================================ */
    function updateMathPreview(inputElement, previewElement) {
      if (!inputElement || !previewElement) return;
      const value = inputElement.value.trim();
      // Пустое поле → очищаем блок предпросмотра (и прячем его)
      if (!value) {
        previewElement.innerHTML = "";
        previewElement.classList.add("math-preview--empty");
        return;
      }
      previewElement.classList.remove("math-preview--empty");

      // 1) Текст со встроенными формулами $...$ / $$...$$
      if (value.indexOf("$") !== -1) {
        previewElement.innerHTML = escapeHtml(value);   // текст экранируем, математику рендерит renderMath
        renderMath(previewElement);
        return;
      }

      // 2) «Голый» LaTeX без $ (например, `\ce{H2O}` или `x^2`) — как отдельная формула
      if (/\\[a-zA-Z]|\^|[{}]/.test(value)
          && typeof katex !== "undefined" && typeof katex.render === "function") {
        try {
          katex.render(value, previewElement, { throwOnError: false, displayMode: true });
          return;
        } catch (e) { /* невалидный ввод → ниже показываем как обычный текст */ }
      }

      // 3) Обычный текст / библиотека не загрузилась
      previewElement.textContent = value;
    }

    // Находит блок предпросмотра для поля (preview-<id>;
    // для вариантов ответа qOpt0..3 — общий блок preview-qOptions)
    function syncMathPreview(field) {
      if (!field || !field.id) return;
      const previewId = /^qOpt/.test(field.id) ? "preview-qOptions" : ("preview-" + field.id);
      const preview = document.getElementById(previewId);
      if (preview) updateMathPreview(field, preview);
    }

    // Привязывает live-обновление к полям формы (шаг 1 + конструктор вопросов)
    function bindMathPreviews(root) {
      if (!root) return;
      // Название теста и текст вопроса
      ["ctName", "qText"].forEach(id => {
        const field = document.getElementById(id);
        if (!field) return;
        field.addEventListener("input", () => syncMathPreview(field));
        syncMathPreview(field);                          // восстановление после перерисовки формы
      });
      // Варианты ответов: общий предпросмотр того поля, в котором сейчас печатают
      const opts = root.querySelectorAll(".q-opt-input");
      opts.forEach(inp => {
        inp.addEventListener("input", () => { activeFormulaField = inp; syncMathPreview(inp); });
      });
      const firstFilled = Array.prototype.find.call(opts, o => o.value.trim());
      syncMathPreview(firstFilled || opts[0]);
    }

    /* ============================================================
       5.11.0.3 МАТЕМАТИЧЕСКАЯ КЛАВИАТУРА (MATH PAD)
       Собственная виртуальная клавиатура формул (внешних библиотек
       нет — поэтому ошибки «mathfield is not defined» невозможны).
       Работает поверх обычных input/textarea: вставляет LaTeX в
       активное поле на место курсора. Маркеры в духе MathLive:
         #@ — «карман» для курсора (в него попадает фокус),
         #? — следующий карман (пропускается).
       ============================================================ */

    // Раскладка: [подпись, код (по умолч. = подпись), ширина кнопки в колонках (по умолч. 2)]
    const MP_KEYS = {
      // «y» — числа, переменные, операции (обычный текст, без LaTeX)
      vars: [
        ["1"], ["2"], ["3"], ["4"], ["5"], ["6"], ["7"], ["8"], ["9"], ["0"],
        ["x"], ["y"], ["z"], ["+"], ["−"], ["×"],
        ["÷"], ["/"], ["="], ["<"], ["≤"], ["≥"],
        ["≠"], ["("], [")"], ["["], ["]"], ["%"],
        ["±"], ["."],
      ],
      // «f(x)» — функции и операторы.
      // Простые символы (π, ω, ∫, ∞, стрелки …) вставляются как Unicode-текст —
      // в поле видно «πω», а не «$\pi$$\omega$». LaTeX оставлен только там,
      // где нужна настоящая вёрстка: дробь, корень, химия, матрицы.
      funcs: [
        ["a/b", "$\\frac{#@}{#?}$"],
        ["√", "$\\sqrt{#@}$"],
        ["∛", "$\\sqrt[3]{#@}$"],
        ["∫", "∫"],
        ["∑", "∑"],
        ["∏", "∏"],
        ["lim", "lim"],
        ["∞", "∞"],
        ["π", "π"],
        ["𝑒", "e"],
        ["ln", "ln"],
        ["log", "log"],
        ["sin", "sin"],
        ["cos", "cos"],
        ["tan", "tan"],
        ["α", "α"],
        ["β", "β"],
        ["θ", "θ"],
        ["σ", "σ"],
        ["ω", "ω"],
        ["Δ", "Δ"],
        ["∈", "∈"],
        ["∩", "∩"],
        ["→", "→"],
        ["⇔", "⇔"],
        ["( )", "()"],
        ["[ ]", "[]"],
        ["H₂O", "$\\ce{#@}$"],
        ["⟶", "⟶"],
        ["⇌", "⇌"],
        ["▦", "$\\begin{pmatrix} #@ & #? \\\\ #? & #? \\end{pmatrix}$", 4],
        ["{ }", "$\\begin{cases} #@ \\\\ #? \\end{cases}$", 4],
        ["|A|", "$\\begin{vmatrix} #@ & #? \\\\ #? & #? \\end{vmatrix}$", 4],
      ],
      // «x²» — степени, индексы, корни (простые — Unicode, структурные — LaTeX)
      powers: [
        ["x²", "x²"],
        ["xⁿ", "xⁿ"],
        ["xₐ", "xₐ"],
        ["x⁻¹", "x⁻¹"],
        ["1/x", "1/x"],
        ["°", "°"],
        ["!", "!"],
        ["|x|", "|x|"],
        ["aᵇ", "aᵇ"],
        ["·", "·"],
        ["≈", "≈"],
        ["≡", "≡"],
      ],
    };

    let mpActiveField = null;   // поле, куда вставляются символы клавиатуры

    // Целится клавиатура в поле и обновляет предпросмотр самой клавиатуры
    function mpSetActiveField(field) {
      mpActiveField = field || null;
      mpSyncPreview();
    }

    function mpSyncPreview() {
      const pv = document.getElementById("mathPreview");
      if (!pv) return;
      updateMathPreview(mpActiveField, pv);   // тот же рендер, что у живого предпросмотра полей
    }

    // Открыть/закрыть плавающий калькулятор: синхронизирует FAB в поле и ƒx в шапке
    function setMathPadOpen(open) {
      const pad = document.getElementById("mathPad");
      if (!pad) return;
      pad.classList.toggle("mp-collapsed", !open);
      const fab = document.getElementById("mpFab");
      if (fab) {
        fab.classList.toggle("mp-fab--active", open);
        fab.setAttribute("aria-expanded", String(open));
      }
      const toggle = document.getElementById("mpToggle");
      if (toggle) toggle.setAttribute("aria-expanded", String(open));
      if (open) {
        try { pad.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
        catch (e) { try { pad.scrollIntoView(); } catch (e2) {} }
      }
    }

    // Вставка LaTeX-кода в активное поле (аналог mathfield.insert, но над input/textarea)
    function insertMathSymbol(latexCode) {
      const field = mpActiveField;
      if (!field || latexCode === undefined || latexCode === null) return false;
      let text = String(latexCode);
      const start = (typeof field.selectionStart === "number") ? field.selectionStart : field.value.length;
      const end = (typeof field.selectionEnd === "number") ? field.selectionEnd : start;
      // Уже внутри $...$ → убираем лишнюю $-обёртку (иначе двойные клики плодят битую вложенность)
      if (text.length > 2 && text.charAt(0) === "$" && text.charAt(text.length - 1) === "$"
          && insideMath(field.value, start)) {
        text = text.slice(1, -1);
      }
      // Вырезаем маркеры #@/#?, запоминаем позиции «карманов»
      const stops = [];
      let cleaned = "";
      for (let i = 0; i < text.length; i++) {
        if (text.charAt(i) === "#" && (text.charAt(i + 1) === "@" || text.charAt(i + 1) === "?")) {
          stops.push(cleaned.length);
          i++;
        } else {
          cleaned += text.charAt(i);
        }
      }
      field.value = field.value.slice(0, start) + cleaned + field.value.slice(end);
      let caret;
      if (stops.length) {
        caret = start + stops[0];                          // в первый «карман» #@ (как в MathLive)
      } else {
        const brace = cleaned.indexOf("{}");
        const open = cleaned.indexOf("(");
        const close = cleaned.indexOf(")");
        const sqOpen = cleaned.indexOf("[");
        const sqClose = cleaned.indexOf("]");
        if (brace !== -1) caret = start + brace + 1;        // \frac{|}{}, \sqrt{|}
        else if (open !== -1 && close > open) caret = start + open + 1;
        else if (sqOpen !== -1 && sqClose > sqOpen) caret = start + sqOpen + 1;
        else caret = start + cleaned.length;
      }
      try { field.setSelectionRange(caret, caret); } catch (e) { /* недоступно у части полей */ }
      try { field.focus({ preventScroll: true }); } catch (e) { try { field.focus(); } catch (e2) {} }
      mpSetActiveField(field);        // предпросмотр клавиатуры — мгновенно
      syncMathPreview(field);         // и штатный живой предпросмотр поля
      return true;
    }

    // Управляющие команды клавиатуры (аналоги mathfield.executeCommand)
    function mpCommand(cmd) {
      const field = mpActiveField;
      if (!field) return;
      const start = (typeof field.selectionStart === "number") ? field.selectionStart : field.value.length;
      const end = (typeof field.selectionEnd === "number") ? field.selectionEnd : start;
      if (cmd === "left") {
        const p = Math.max(0, start - 1);
        try { field.setSelectionRange(p, p); } catch (e) {}
        field.focus();
      } else if (cmd === "right") {
        const p = Math.min(field.value.length, end + 1);
        try { field.setSelectionRange(p, p); } catch (e) {}
        field.focus();
      } else if (cmd === "backspace") {
        if (start !== end) field.value = field.value.slice(0, start) + field.value.slice(end);
        else if (start > 0) field.value = field.value.slice(0, start - 1) + field.value.slice(start);
        const p = (start !== end) ? start : Math.max(0, start - 1);
        try { field.setSelectionRange(p, p); } catch (e) {}
        field.focus();
        mpSyncPreview();
        syncMathPreview(field);
      } else if (cmd === "enter") {
        if (field.tagName === "TEXTAREA") insertMathSymbol("\n");   // многострочное поле — перевод строки
      } else if (cmd === "abc") {
        // Свернуть клавиатуру → печатаем обычной (физической/нативной) клавиатурой.
        // Кнопка «ƒx» в шапке разворачивает её обратно.
        setMathPadOpen(false);
        try { field.focus(); } catch (e) {}
      }
    }

    // HTML клавиатуры (над текстом вопроса в конструкторе)
    function mathPadHTML() {
      const dict = translations[currentLang];
      const tabs = [
        { id: "vars",   glyph: "y",    title: dict.mpVars },
        { id: "funcs",  glyph: "f(x)", title: dict.mpFuncs },
        { id: "powers", glyph: "x²",   title: dict.mpPowers },
      ];
      const btn = (key, group) => {
        const label = key[0];
        const code = (key.length > 1 && key[1] !== undefined) ? key[1] : label;
        const span = (key.length > 2 && key[2]) ? key[2] : 2;
        const fn = (code.indexOf("\\") !== -1 || code.charAt(0) === "$") ? " mp-btn--fn" : "";
        // Визуальные типы клавиш: цифры жирнее, переменные и операторы — акцентные,
        // матрица — «инструментальная» тёмная клавиша (как в референсе калькулятора).
        let kind = "";
        if (group === "vars") {
          if (/^[0-9]$/.test(label)) kind = " mp-btn--num";
          else if (/^[xyz]$/.test(label)) kind = " mp-btn--var";
          else if ("+−×÷/=<≤≥≠%±.,".indexOf(label) !== -1) kind = " mp-btn--op";
        } else if (code.indexOf("\\begin{") !== -1) {
          kind = " mp-btn--tool";
        }
        return `<button type="button" class="mp-btn${fn}${kind}" style="grid-column: span ${span}"
                  data-mp="${escapeHtml(code)}" title="${escapeHtml(label)}">${label}</button>`;
      };
      const groups = Object.keys(MP_KEYS).map(g => `
            <div class="mp-keys" data-mp-group="${g}" style="display:${g === 'vars' ? 'grid' : 'none'}">${MP_KEYS[g].map(k => btn(k, g)).join('')}</div>`).join('');
      const tabBtns = tabs.map(t => `<button type="button" class="mp-tab${t.id === 'vars' ? ' mp-tab--active' : ''}" data-mp-tab="${t.id}" title="${escapeHtml(t.title)}">${t.glyph}</button>`).join('');
      return `
            <div class="math-pad mp-collapsed" id="mathPad">
              <div class="mp-head">
                <span class="mp-title"><span class="mp-title-badge">ƒx</span>${escapeHtml(dict.mpTitle)}</span>
                <span class="mp-head-actions">
                  <button type="button" class="mp-toggle mp-pt" id="mpPt" title="${escapeHtml(dict.ptTitle)}" aria-label="${escapeHtml(dict.ptTitle)}">🧪</button>
                  <button type="button" class="mp-toggle" id="mpToggle" title="${escapeHtml(dict.mpAbc)}" aria-expanded="false">ƒx</button>
                </span>
              </div>
              <div class="mp-body">
                <div class="mp-tabs">${tabBtns}</div>
                <div class="math-preview math-preview--empty" id="mathPreview" aria-live="polite"></div>
                ${groups}
                <div class="mp-keys mp-ctrl" style="display:grid">
                  <button type="button" class="mp-btn" style="grid-column: span 4" data-mp-cmd="abc" title="${escapeHtml(dict.mpAbc)}">abc</button>
                  <button type="button" class="mp-btn" data-mp-cmd="left">←</button>
                  <button type="button" class="mp-btn" data-mp-cmd="right">→</button>
                  <button type="button" class="mp-btn" data-mp-cmd="backspace">⌫</button>
                  <button type="button" class="mp-btn" data-mp-cmd="enter">↵</button>
                </div>
              </div>
            </div>`;
    }

    // Биндинг клавиатуры: клики по кнопкам/табам + наведение на поля формы
    function bindMathPad(root) {
      const pad = root.querySelector("#mathPad");
      if (!pad) return;
      // Плавающая кнопка ƒx в углу поля вопроса
      const fab = root.querySelector("#mpFab");
      if (fab) {
        fab.addEventListener("mousedown", (e) => e.preventDefault());   // не терять курсор поля
        fab.addEventListener("click", (e) => {
          e.preventDefault();
          const willOpen = pad.classList.contains("mp-collapsed");
          setMathPadOpen(willOpen);
          if (willOpen) mpSetActiveField(document.getElementById("qText"));
          else {
            const q = document.getElementById("qText");
            if (q) { try { q.focus(); } catch (err) {} }
          }
        });
      }
      // mousedown по кнопке не должен снимать фокус с поля ввода (иначе теряется курсор)
      pad.addEventListener("mousedown", (e) => {
        if (e.target.closest(".mp-btn, .mp-tab, .mp-toggle")) e.preventDefault();
      });
      pad.addEventListener("click", (e) => {
        const btn = e.target.closest(".mp-btn, .mp-tab, .mp-toggle");
        if (!btn || !pad.contains(btn)) return;
        e.preventDefault();
        // Табы: переключаем группы кнопок
        if (btn.classList.contains("mp-tab")) {
          pad.querySelectorAll(".mp-tab").forEach(t => t.classList.toggle("mp-tab--active", t === btn));
          pad.querySelectorAll(".mp-keys[data-mp-group]").forEach(g => {
            g.style.display = (g.dataset.mpGroup === btn.dataset.mpTab) ? "grid" : "none";
          });
          return;
        }
        // 🧪: таблица Менделеева — символ вставится в активное поле калькулятора
        if (btn.classList.contains("mp-pt")) {
          openPeriodicTable(mpActiveField || document.getElementById("qText"));
          return;
        }
        // ƒx: показать/скрыть калькулятор (по умолчанию он свёрнут)
        if (btn.classList.contains("mp-toggle")) {
          setMathPadOpen(pad.classList.contains("mp-collapsed"));
          return;
        }
        // Управляющие команды: abc ← → ⌫ ↵
        if (btn.dataset.mpCmd) { mpCommand(btn.dataset.mpCmd); return; }
        // Обычная кнопка символа → вставка кода в активное поле
        if (btn.dataset.mp !== undefined) insertMathSymbol(btn.dataset.mp);
      });
      // Клавиатура целится в поле, на котором стоит фокус (вопрос или любой вариант ответа)
      ["qText", "qOpt0", "qOpt1", "qOpt2", "qOpt3"].forEach(id => {
        const f = document.getElementById(id);
        if (f) f.addEventListener("focus", () => mpSetActiveField(f));
      });
      mpSetActiveField(document.getElementById("qText"));
    }

    /* ============================================================
       MathLive — готовый WYSIWYG-редактор формул (Photomath-стиль).
       Когда библиотека загружена, вместо самодельного Math Pad
       показывается <math-field> + встроенная виртуальная клавиатура.
       Значение зеркалится в скрытую #qText, чтобы валидации, черновик
       и сохранение теста продолжали работать без переделки.
       ============================================================ */
    function isMathLiveReady() {
      return !!(window.customElements && customElements.get("math-field")
        && window.mathVirtualKeyboard && typeof window.mathVirtualKeyboard.show === "function");
    }

    function stripMathDelims(value) {
      const v = String(value || "").trim();
      if (v.startsWith("$$") && v.endsWith("$$") && v.length >= 4) return v.slice(2, -2);
      if (v.startsWith("$") && v.endsWith("$") && v.length >= 2) return v.slice(1, -1);
      return v;
    }

    // Дополнительные вкладки встроенной клавиатуры MathLive:
    // ▦ — матрицы/производные/диффуры, 🧪 — химия + таблица Менделеева.
    function setupMathLiveKeyboard() {
      if (!window.mathVirtualKeyboard) return;
      const m2 = "\\begin{pmatrix}#@&#?\\\\#?&#?\\end{pmatrix}";
      const m3 = "\\begin{pmatrix}#@&#?&#?\\\\#?&#?&#?\\\\#?&#?&#?\\end{pmatrix}";
      const cases = "\\begin{cases}#@\\\\#?\\end{cases}";
      const det = "\\begin{vmatrix}#@&#?\\\\#?&#?\\end{vmatrix}";
      mathVirtualKeyboard.layouts = [
        "numeric",
        {
          id: "formetra-matrices",
          label: "▦",
          rows: [
            [
              { label: "Матрица…", class: "small", width: 2, insert: "\\text{MATRIXDLG}" },
              { label: "2×2", insert: m2 },
              { label: "3×3", insert: m3 },
              { label: "{", insert: cases },
              { label: "|A|", insert: det },
            ],
            [
              { label: "d/dx", insert: "\\frac{d#?}{dx}" },
              { label: "d²/dx²", insert: "\\frac{d^2#?}{dx^2}" },
              { label: "∂/∂x", insert: "\\frac{\\partial #?}{\\partial x}" },
              { label: "∫dx", insert: "\\int #?\\,dx" },
              { label: "dy/dx", insert: "\\frac{dy}{dx}=#?" },
              { label: "ДУ", insert: "y''+#?y'+#?y=0" },
            ],
          ],
        },
        "symbols",
        "alphabetic",
        {
          id: "formetra-diagrams",
          label: "📐",
          rows: [
            [
              { label: "Схема к вопросу", class: "small", width: 4, insert: "\\text{DIAGRAMDLG}" },
            ],
          ],
        },
        {
          id: "formetra-chemistry",
          label: "🧪",
          rows: [
            [
              { label: "H₂O", insert: "\\mathrm{H_2O}" },
              { label: "CO₂", insert: "\\mathrm{CO_2}" },
              { label: "O₂", insert: "\\mathrm{O_2}" },
              { label: "NH₃", insert: "\\mathrm{NH_3}" },
              { label: "CH₄", insert: "\\mathrm{CH_4}" },
            ],
            [
              { label: "→", insert: "\\longrightarrow" },
              { label: "⇌", insert: "\\rightleftharpoons" },
              { label: "Таблица", class: "small", width: 2, insert: "\\text{PTTABLE}" },
            ],
          ],
        },
        "greek",
      ];
    }

    function bindMathLiveEditor(root) {
      const mf = root.querySelector("#qTextLive");
      const ta = root.querySelector("#qText");
      const fab = root.querySelector("#mpFab");
      const pad = root.querySelector("#mathPad");
      if (!mf || !ta) return false;

      if (!isMathLiveReady()) {
        mf.style.display = "none";
        ta.style.display = "";
        return false;                       // fallback: textarea + старый Math Pad
      }

      // MathLive загружен: WYSIWYG-поле вместо textarea, старый Math Pad скрыт
      mf.style.display = "block";
      ta.style.display = "none";
      if (pad) pad.style.display = "none";
      try { mf.menuItems = []; } catch (e) {}   // без встроенного меню/гамбургера
      setupMathLiveKeyboard();                  // вкладки ▦ (матрицы/производные/ДУ) и 🧪 (химия/таблица)
      mf.value = stripMathDelims(ta.value);

      const sync = () => {
        // Служебный маркер от кнопки «Таблица» в химической вкладке:
        // убираем его из формулы и открываем таблицу Менделеева.
        if (mf.value.indexOf("PTTABLE") !== -1) {
          mf.value = mf.value.replace(/\\text\{PTTABLE\}/g, "");
          openPeriodicTable(mf);
        }
        if (mf.value.indexOf("MATRIXDLG") !== -1) {
          mf.value = mf.value.replace(/\\text\{MATRIXDLG\}/g, "");
          openMatrixDialog(mf);
        }
        if (mf.value.indexOf("DIAGRAMDLG") !== -1) {
          mf.value = mf.value.replace(/\\text\{DIAGRAMDLG\}/g, "");
          openDiagramModal();
        }
        // \placeholder{} — служебные «пустые карманы» MathLive; KaTeX их не понимает,
        // поэтому в скрытую #qText (и на экраны студента) уходит чистый LaTeX.
        const latex = String(mf.value || "").replace(/\\placeholder\{\}/g, "").trim();
        ta.value = latex ? `$${latex}$` : "";
        ta.dispatchEvent(new Event("input", { bubbles: true }));
      };
      mf.addEventListener("input", sync);
      mf.addEventListener("change", sync);

      // ƒx в углу поля — показать/скрыть встроенную клавиатуру MathLive
      if (fab) {
        fab.addEventListener("mousedown", (e) => e.preventDefault());
        fab.addEventListener("click", (e) => {
          e.preventDefault();
          const wasVisible = !!window.mathVirtualKeyboard.visible;
          try { mf.focus(); } catch (err) {}
          if (wasVisible) window.mathVirtualKeyboard.hide();
          else window.mathVirtualKeyboard.show();
        });
      }
      // Клавиатура — только по кнопке ƒx (не выскакивает при каждом фокусе)
      try {
        window.mathVirtualKeyboard.addEventListener("virtual-keyboard-toggle", () => {
          const visible = !!window.mathVirtualKeyboard.visible;
          if (fab) {
            fab.classList.toggle("mp-fab--active", visible);
            fab.setAttribute("aria-expanded", String(visible));
          }
        });
      } catch (e) { /* старые версии MathLive без события */ }
      return true;
    }

    // ---- Периодическая таблица Менделеева (справочник, клик → вставка символа) ----
    const PT_SYMBOLS = ("H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn " +
      "Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu " +
      "Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm " +
      "Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og").split(" ");
    const PT_RU = ("Водород Гелий Литий Бериллий Бор Углерод Азот Кислород Фтор Неон Натрий Магний Алюминий " +
      "Кремний Фосфор Сера Хлор Аргон Калий Кальций Скандий Титан Ванадий Хром Марганец Железо Кобальт Никель " +
      "Медь Цинк Галлий Германий Мышьяк Селен Бром Криптон Рубидий Стронций Иттрий Цирконий Ниобий Молибден " +
      "Технеций Рутений Родий Палладий Серебро Кадмий Индий Олово Сурьма Теллур Иод Ксенон Цезий Барий " +
      "Лантан Церий Празеодим Неодим Прометий Самарий Европий Гадолиний Тербий Диспрозий Гольмий Эрбий " +
      "Тулий Иттербий Лютеций Гафний Тантал Вольфрам Рений Осмий Иридий Платина Золото Ртуть Таллий Свинец " +
      "Висмут Полоний Астат Радон Франций Радий Актиний Торий Протактиний Уран Нептуний Плутоний Америций " +
      "Кюрий Берклий Калифорний Эйнштейний Фермий Менделевий Нобелий Лоуренсий Резерфордий Дубний Сиборгий Борий " +
      "Хассий Мейтнерий Дармштадтий Рентгений Коперниций Нихоний Флеровий Московий Ливерморий Теннессин " +
      "Оганессон").split(" ");
    const PT_EN = ("Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium " +
      "Magnesium Aluminum Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium " +
      "Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton " +
      "Rubidium Strontium Yttrium Zirconium Niobium Molybdenum Technetium Ruthenium Rhodium Palladium Silver " +
      "Cadmium Indium Tin Antimony Tellurium Iodine Xenon Cesium Barium Lanthanum Cerium Praseodymium " +
      "Neodymium Promethium Samarium Europium Gadolinium Terbium Dysprosium Holmium Erbium Thulium " +
      "Ytterbium Lutetium Hafnium Tantalum Tungsten Rhenium Osmium Iridium Platinum Gold Mercury Thallium " +
      "Lead Bismuth Polonium Astatine Radon Francium Radium Actinium Thorium Protactinium Uranium Neptunium " +
      "Plutonium Americium Curium Berkelium Californium Einsteinium Fermium Mendelevium Nobelium Lawrencium " +
      "Rutherfordium Dubnium Seaborgium Bohrium Hassium Meitnerium Darmstadtium Roentgenium Copernicium " +
      "Nihonium Flerovium Moscovium Livermorium Tennessine Oganesson").split(" ");

    // Позиция элемента в сетке: колонка 1–18, строка 1–7; лантаноиды/актиноиды — ряды 9–10
    function ptPos(z) {
      if (z <= 2)   return { c: z === 1 ? 1 : 18, r: 1 };
      if (z <= 4)   return { c: z - 2,  r: 2 };            // Li–Be
      if (z <= 10)  return { c: z + 8,  r: 2 };            // B–Ne (13–18)
      if (z <= 12)  return { c: z - 10, r: 3 };            // Na–Mg
      if (z <= 18)  return { c: z,      r: 3 };            // Al–Ar
      if (z <= 36)  return { c: z - 18, r: 4 };            // K–Kr
      if (z <= 54)  return { c: z - 36, r: 5 };            // Rb–Xe
      if (z <= 56)  return { c: z - 54, r: 6 };            // Cs–Ba
      if (z <= 71)  return { c: z - 53, r: 9 };            // La–Lu (нижний ряд)
      if (z <= 86)  return { c: z - 68, r: 6 };            // Hf–Rn
      if (z <= 88)  return { c: z - 86, r: 7 };            // Fr–Ra
      if (z <= 103) return { c: z - 85, r: 10 };           // Ac–Lr (нижний ряд)
      return { c: z - 100, r: 7 };                         // Rf–Og
    }

    // Поле, в которое вставится символ по клику из таблицы
    let ptField = null;

    // Оболочка модалки (создаётся в body один раз, лениво)
    function periodicTableHTML() {
      return `<div class="pt-overlay hidden" id="ptOverlay"></div>`;
    }

    // Содержимое окна таблицы (перерисовывается при каждом открытии — актуальный язык)
    function periodicTableWindowHTML() {
      const dict = translations[currentLang];
      const cells = PT_SYMBOLS.map((sym, i) => {
        const z = i + 1;
        const pos = ptPos(z);
        const name = currentLang === 'ru' ? PT_RU[i] : PT_EN[i];
        return `<button type="button" class="pt-el" data-sym="${sym}"
                  data-search="${(sym + ' ' + name + ' ' + z).toLowerCase()}"
                  style="grid-column:${pos.c}; grid-row:${pos.r}"
                  title="${z} · ${name}">
                  <span class="pt-num">${z}</span><span class="pt-sym">${sym}</span>
                </button>`;
      }).join("");
      return `
        <div class="pt-window" role="dialog" aria-modal="true" aria-label="${dict.ptTitle}">
          <div class="pt-head">
            <div class="pt-title">🧪 ${dict.ptTitle}</div>
            <button type="button" class="pt-close" id="ptClose">✕</button>
          </div>
          <input type="text" class="pt-search" id="ptSearch" placeholder="${dict.ptSearch}">
          <div class="pt-scroll"><div class="pt-grid">${cells}</div></div>
          <div class="pt-legend"><i class="fas fa-hand-pointer"></i> ${dict.ptHint}</div>
        </div>`;
    }

    // Открывает таблицу: символ вставится в field (или в последнее поле формул)
    function openPeriodicTable(field) {
      ptField = field || activeFormulaField;
      let overlay = document.getElementById('ptOverlay');
      if (!overlay) {
        document.body.insertAdjacentHTML('beforeend', periodicTableHTML());
        overlay = document.getElementById('ptOverlay');
        // Делегирование — переживает перерисовку окна (смена языка) и 118 ячеек
        overlay.addEventListener('click', (e) => {
          const cell = e.target.closest('.pt-el');
          if (cell) {
            // MathLive-поле умеет вставлять в позицию курсора; обычный textarea — через сниппет
            if (ptField && ptField.tagName === 'MATH-FIELD' && typeof ptField.insert === 'function') {
              ptField.insert(cell.dataset.sym);
              try { ptField.focus(); } catch (err) {}
              // MathLive.insert() не всегда шлёт input — синхронизируем скрытую #qText вручную
              ptField.dispatchEvent(new Event('input', { bubbles: true }));
            } else {
              insertFormulaSnippet(ptField, cell.dataset.sym);
            }
            return;
          }
          if (e.target.closest('#ptClose') || e.target === overlay) closePeriodicTable();
        });
        overlay.addEventListener('input', (e) => {
          if (e.target.id === 'ptSearch') filterPeriodicTable(e.target.value);
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closePeriodicTable();
        });
      }
      overlay.innerHTML = periodicTableWindowHTML();
      overlay.classList.remove('hidden');
      document.getElementById('ptSearch').focus();
    }

    function closePeriodicTable() {
      const overlay = document.getElementById('ptOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    /* ---- Мини-диалог «Размер матрицы»: любая матрица, в т.ч. неквадратная ---- */
    let matrixTargetField = null;

    function matrixDialogHTML() {
      return `
        <div class="pt-overlay hidden" id="matrixOverlay">
          <div class="pt-window mx-window" role="dialog" aria-modal="true" aria-label="Размер матрицы">
            <div class="pt-head">
              <div class="pt-title">▦ Размер матрицы</div>
              <button type="button" class="pt-close" id="mxClose">✕</button>
            </div>
            <div class="mx-fields">
              <label class="mx-field">Строки
                <input type="number" id="mxRows" min="1" max="10" value="2">
              </label>
              <span class="mx-times">×</span>
              <label class="mx-field">Столбцы
                <input type="number" id="mxCols" min="1" max="10" value="2">
              </label>
            </div>
            <p class="mx-hint">От 1 до 10. Матрица может быть неквадратной — например, 2×3 или 4×2.</p>
            <div class="mx-actions">
              <button type="button" class="btn-ghost" id="mxCancel">Отмена</button>
              <button type="button" class="btn-primary" id="mxInsert">Вставить</button>
            </div>
          </div>
        </div>`;
    }

    function openMatrixDialog(field) {
      matrixTargetField = field || null;
      let overlay = document.getElementById('matrixOverlay');
      if (!overlay) {
        document.body.insertAdjacentHTML('beforeend', matrixDialogHTML());
        overlay = document.getElementById('matrixOverlay');
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay || e.target.closest('#mxClose') || e.target.closest('#mxCancel')) {
            closeMatrixDialog();
            return;
          }
          if (e.target.closest('#mxInsert')) insertMatrixFromDialog();
        });
        document.addEventListener('keydown', (e) => {
          const o = document.getElementById('matrixOverlay');
          if (e.key === 'Escape' && o && !o.classList.contains('hidden')) closeMatrixDialog();
        });
      }
      const rows = document.getElementById('mxRows');
      const cols = document.getElementById('mxCols');
      if (rows) rows.value = '2';
      if (cols) cols.value = '2';
      overlay.classList.remove('hidden');
      if (rows) { try { rows.focus(); rows.select(); } catch (e) {} }
    }

    function closeMatrixDialog() {
      const overlay = document.getElementById('matrixOverlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function insertMatrixFromDialog() {
      const rowsEl = document.getElementById('mxRows');
      const colsEl = document.getElementById('mxCols');
      const rows = Math.min(10, Math.max(1, parseInt(rowsEl ? rowsEl.value : '2', 10) || 2));
      const cols = Math.min(10, Math.max(1, parseInt(colsEl ? colsEl.value : '2', 10) || 2));
      const cell = "\\placeholder{}";
      const body = Array.from({ length: rows }, () =>
        Array.from({ length: cols }, () => cell).join(" & ")
      ).join(" \\\\ ");
      const latex = "\\begin{pmatrix}" + body + "\\end{pmatrix}";
      const field = matrixTargetField;
      if (field && field.tagName === "MATH-FIELD" && typeof field.insert === "function") {
        field.insert(latex);
        try { field.focus(); } catch (e) {}
        field.dispatchEvent(new Event("input", { bubbles: true }));
        // после закрытия диалога возвращаем виртуальную клавиатуру
        try { if (window.mathVirtualKeyboard) window.mathVirtualKeyboard.show(); } catch (e) {}
      } else if (field) {
        insertFormulaSnippet(field, "$" + latex + "$");
      }
      closeMatrixDialog();
    }

    // Поиск: скрывает несовпадающие ячейки через visibility (сетка не разъезжается)
    function filterPeriodicTable(q) {
      const query = String(q || '').trim().toLowerCase();
      document.querySelectorAll('#ptOverlay .pt-el').forEach(cell => {

    // Оценка по проценту (общая шкала — как в calcResult)
    function gradeFromPercent(percent) {
      if (percent >= 90) return 5;
      if (percent >= 75) return 4;
      if (percent >= 60) return 3;
      return 2;
    }

    // Приводит запись результата (историческую или из localStorage) к единому виду
    // для таблицы: { testId, testTitle, studentName, studentGroup, correct, total, percent, grade, date }
    function normalizeResult(r) {
      const total   = Number(r.total || r.maxScore || 0);
      const correct = Number(r.correct != null ? r.correct : (r.score || 0));
      const percent = r.percent != null ? Number(r.percent)
                    : (total ? Math.round((correct / total) * 100) : 0);
      const grade   = r.grade != null ? Number(r.grade) : gradeFromPercent(percent);

      // Название теста: явное → поиск по id в базе → сам id
      let title = r.testTitle;
      if (!title) {
        const t = mockTests.find(x => String(x.id) === String(r.testId));
        title = t ? testTitle(t) : String(r.testId);
      }

      // Дата: DD.MM.YYYY как есть, YYYY-MM-DD → через formatDate, иначе — сегодня
      const rawDate = String(r.date || "");
      const date = /^\d{2}\.\d{2}\.\d{4}$/.test(rawDate) ? rawDate
                 : (/^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? formatDate(r.date) : formatDate());

      return {
        testId: r.testId,
        testTitle: title,
        // В unitest_results имя студента не сохраняется (Промт №7) — берём из mockStudent
        studentName: r.studentName ||
          `${mockStudent.lastName} ${mockStudent.firstName[0]}.${mockStudent.middleName[0]}.`,
        studentGroup: r.studentGroup || mockStudent.group,
        correct, total, percent, grade, date
      };
    }

    // Строит HTML разбора ответов (✅/❌, подсветка правильного/выбранного)
    function renderReview() {

      return activeQuestions().map((q, i) => {
        const chosen = userAnswers[i];

          let cls = "review-opt";
          if (oi === q.correct) cls += " correct";                 // правильный — зелёный

          return `<div class="${cls}"><b>${letters[oi] || (oi + 1)}</b> ${opt}</div>`;
        }).join("");

        return `
          <div class="review-item ${isCorrect ? "correct-item" : "wrong-item"}" data-correct="${isCorrect}">
            <div class="review-head">
              <span class="review-num">${i + 1}</span>

    /* ============================================================
       5.11 АПЕЛЛЯЦИИ (Промт №33): подача студентом
       ============================================================ */
    let mockAppeals = [];                 // копия базы апелляций в памяти
    let currentAppealResultId = null;     // resultId, к которому привязана открытая модалка

    // Безопасное чтение апелляций из localStorage
    function getAppeals() {
      try {
        const list = JSON.parse(localStorage.getItem(APPEALS_KEY) || "[]");
        return Array.isArray(list) ? list.filter(a => a && typeof a === "object") : [];
      } catch (e) {
        console.error("Не удалось прочитать апелляции:", e);
        return [];
      }
    }

    // Восстанавливает массив апелляций при старте (F5)
    function loadAppealsFromStorage() {
      const list = getAppeals();
      mockAppeals.length = 0;
      list.forEach(a => mockAppeals.push(a));
      console.log("Апелляции восстановлены из localStorage:", mockAppeals.length);
    }

    // Сохраняет апелляции; переполнение localStorage не роняет экран
    function saveAppealsToStorage(list) {
      const dict = translations[currentLang];
      try {
        localStorage.setItem(APPEALS_KEY, JSON.stringify(list));
        mockAppeals.length = 0;
        (list || []).forEach(a => mockAppeals.push(a));
        return true;
      } catch (e) {
        console.error("Не удалось сохранить апелляции:", e);
        alert(dict.storageFull);
        return false;
      }
    }

    // Стабильный ключ результата: id (новый формат) или комбинация полей (старый)
    function resultKey(res) {
      if (!res) return "";
      if (res.id != null && res.id !== "") return String(res.id);
      return [
        res.testId != null ? res.testId : "",
        res.date || "",
        res.percent != null ? res.percent : "",
        res.correct != null ? res.correct : ""
      ].join("|");
    }

    // Апелляция конкретного результата (привязка к resultId)
    function getAppealForResult(res) {
      const key = resultKey(res);
      if (!key) return null;
      return getAppeals().find(a => String(a.resultId) === key) || null;
    }

    // Апелляция по тесту (по промту №33: повторно на тот же тест подать нельзя)
    function getAppealForTest(testId) {
      if (testId == null) return null;
      return getAppeals().find(a => String(a.testId) === String(testId)) || null;
    }

    // Для экрана результата: сначала ищем по resultId, затем по testId
    function getStudentAppeal(res) {
      if (!res) return null;
      return getAppealForResult(res) || getAppealForTest(res.testId);
    }

    // Бейдж статуса апелляции (pending / approved / rejected)
    function appealStatusBadge(status) {
      const dict = translations[currentLang];
      const map = {
        pending:  { key: "appealPending",  icon: "fa-hourglass-half" },
        approved: { key: "appealApproved", icon: "fa-circle-check" },
        rejected: { key: "appealRejected", icon: "fa-circle-xmark" }
      };
      const state = map[status] ? status : "pending";
      const item = map[state];
      return `<span class="appeal-badge appeal-badge--${state}"><i class="fas ${item.icon}"></i> ${dict[item.key]}</span>`;
    }

    // Кнопка подачи или бейдж статуса (используется на результате и в разделе)
    function appealActionHTML(res, btnId = "") {
      const dict = translations[currentLang];
      const existing = getStudentAppeal(res);
      if (existing) return appealStatusBadge(existing.status);
      const idAttr = btnId ? ` id="${btnId}"` : "";
      return `<button type="button" class="appeal-btn"${idAttr} data-appeal-result="${escapeHtml(resultKey(res))}">
        <i class="fas fa-triangle-exclamation"></i> ${dict.appealSubmit}
      </button>`;
    }

    // Разметка модального окна «Оспорить результат»
    function appealModalHTML() {
      const dict = translations[currentLang];
      return `
        <div class="pt-overlay hidden" id="appealOverlay">
          <div class="pt-window appeal-modal" role="dialog" aria-modal="true" aria-labelledby="appealModalTitle">
            <div class="pt-head">
              <div class="pt-title" id="appealModalTitle">${dict.appealTitle}</div>
              <button type="button" class="pt-close" id="appealClose" aria-label="${dict.close}">✕</button>
            </div>
            <p class="appeal-intro">${dict.appealIntro}</p>
            <label class="field">
              <span class="field-label">${dict.appealReasonLabel} <b class="req">*</b></span>
              <textarea class="field-input" id="appealReasonInput" rows="5" maxlength="600"
                        placeholder="${dict.appealReasonPlaceholder}"></textarea>
            </label>
            <div class="form-actions">
              <button type="button" class="btn-ghost" id="appealCancel">${dict.cancel}</button>
              <button type="button" class="btn-primary" id="appealSend">${dict.appealSend}</button>
            </div>
          </div>
        </div>`;
    }

    // Открывает модалку подачи (из результата теста или из раздела «Апелляции»)
    function openAppealModal(res) {
      const dict = translations[currentLang];
      const target = res || lastResult;
      if (!target) return;

      // Повторная подача на этот тест запрещена
      if (getStudentAppeal(target)) { alert(dict.appealErrExists); return; }

      currentAppealResultId = resultKey(target);

      let overlay = document.getElementById("appealOverlay");
      if (!overlay) {
        document.body.insertAdjacentHTML("beforeend", appealModalHTML());
        overlay = document.getElementById("appealOverlay");
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay || e.target.closest("#appealClose") || e.target.closest("#appealCancel")) {
            closeAppealModal();
            return;
          }
          if (e.target.closest("#appealSend")) submitAppeal();
        });
        document.addEventListener("keydown", (e) => {
          const o = document.getElementById("appealOverlay");
          if (e.key === "Escape" && o && !o.classList.contains("hidden")) closeAppealModal();
        });
      }

      const input = document.getElementById("appealReasonInput");
      if (input) input.value = "";
      overlay.classList.remove("hidden");
      if (input) { try { input.focus(); } catch (e) {} }

      console.log("Открыто окно апелляции для теста:", target.testId);
      console.log("Апелляция привязана к результату:", currentAppealResultId);
    }

    // Закрывает модалку подачи
    function closeAppealModal() {
      const overlay = document.getElementById("appealOverlay");
      if (overlay) overlay.classList.add("hidden");
    }

    // Отправка апелляции: валидация, сохранение в unitest_appeals, обновление UI
    function submitAppeal() {
      const dict = translations[currentLang];
      const input = document.getElementById("appealReasonInput");
      const reason = (input ? input.value : "").trim();

      // Самопроверка №2: пустая причина
      if (!reason) { alert(dict.appealErrReason); return; }

      const results = getResults();
      const stored = (Array.isArray(results) ? results : [])
        .find(r => resultKey(r) === currentAppealResultId) || null;
      const target = stored || lastResult || null;
      const testId = target ? target.testId : null;

      // Повторная апелляция на тот же тест
      if (getAppealForResult({ id: currentAppealResultId }) || getAppealForTest(testId)) {
        alert(dict.appealErrExists);
        return;
      }

      const foundTest = mockTests.find(t => String(t.id) === String(testId));
      const title = (target && target.testTitle)
        || (foundTest ? testTitle(foundTest) : String(testId || ""));

      const newAppeal = {
        id: "app_" + Date.now(),
        resultId: currentAppealResultId,          // привязка к конкретному результату
        testId: testId,
        testTitle: title,
        studentName: `${mockStudent.lastName} ${mockStudent.firstName} ${mockStudent.middleName}`,
        studentGroup: mockStudent.group,
        reason: reason,
        date: new Date().toISOString().slice(0, 10),
        status: "pending"
      };

      const all = getAppeals();
      all.unshift(newAppeal);
      if (!saveAppealsToStorage(all)) return;

      console.log("Апелляция сохранена:", newAppeal);
      console.log("Всего апелляций в базе:", mockAppeals.length);

      closeAppealModal();
      currentAppealResultId = null;

      // Обновляем экран результата (кнопка → бейдж) и/или раздел «Апелляции»
      const rs = document.getElementById("resultScreen");
      if (rs && !rs.classList.contains("hidden") && lastResult) renderResult(lastResult);
      if (currentRole === "student" && currentSection === "appeals") renderSectionContent();
    }

    // Раздел «Апелляции»: результаты студента + статус/кнопка подачи
    function renderStudentAppeals() {
      const dict = translations[currentLang];
      const rawResults = getResults();
      const results = Array.isArray(rawResults) ? rawResults : [];

      console.log("Апелляций в базе:", getAppeals().length);
      console.log("Результатов студента:", results.length);

      if (!results.length) {
        return `
          <div class="content-placeholder">
            <i class="fas fa-triangle-exclamation"></i>
            <span>${dict.appealsEmpty}</span>
          </div>`;
      }

      const cards = results.slice().reverse().map(r => {
        const norm = normalizeResult(r);
        const appeal = getStudentAppeal(r);
        const statusHTML = appeal
          ? `<div class="appeal-status-row">
               ${appealStatusBadge(appeal.status)}
               <span class="appeal-date"><i class="fas fa-calendar-day"></i> ${formatDate(appeal.date)}</span>
             </div>
             <p class="appeal-reason">${escapeHtml(appeal.reason)}</p>`
          : appealActionHTML(r);

        return `
          <article class="appeal-card" data-result-key="${escapeHtml(resultKey(r))}">
            <div class="appeal-card-head">
              <h3 class="appeal-card-title">${escapeHtml(norm.testTitle)}</h3>
              <span class="appeal-card-grade">${dict.gradeWord}: <b>${norm.grade}</b></span>
            </div>
            <div class="appeal-card-meta">
              <span><i class="fas fa-calendar-day"></i> ${norm.date}</span>
              <span><i class="fas fa-percent"></i> ${norm.percent}%</span>
              <span><i class="fas fa-check"></i> ${norm.correct} ${dict.qOf} ${norm.total}</span>
            </div>
            ${statusHTML}
          </article>`;
      }).join("");

      return `<p class="appeals-intro">${dict.appealsIntro}</p>
              <div class="appeals-grid">${cards}</div>`;
    }

    // Клики по кнопкам «Подать апелляцию» в разделе
    function bindStudentAppeals() {
      const box = document.getElementById("sectionContent");
      if (!box) return;
      box.querySelectorAll("[data-appeal-result]").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.appealResult;
          const list = getResults();
          const result = (Array.isArray(list) ? list : []).find(r => resultKey(r) === key) || null;
          if (result) openAppealModal(result);
        });
      });
    }

    /* ============================================================
       6. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
       ============================================================ */
    function initApp() {
      // Системные настройки админки (Промт №29): загружаем до применения темы/языка,
      // чтобы значения по умолчанию работали при первом открытии.
      loadAdminSettingsFromStorage();
      if (!localStorage.getItem('unitest_lang') && systemSettings.language) currentLang = systemSettings.language;
      if (!localStorage.getItem('unitest_theme') && systemSettings.theme) currentTheme = systemSettings.theme;

      // Восстанавливаем сохранённые настройки темы и языка
      applyTheme();
      applyLanguage();

      // Демо-данные: первичные результаты тестов (2 пройденных)
      ensureMockResults();

      // Восстанавливаем сохранённые тесты (созданные преподавателями, Промт №14)
      loadTestsFromStorage();
      // Восстанавливаем группы из unitest_groups (созданные админом, Промт №25)
      loadGroupsFromStorage();
      // Восстанавливаем пользователей из uniteststudents / unitestteachers (Промт №26)
      loadAdminUsersFromStorage();
      // Восстанавливаем назначения менеджеров из unitest_managers (Промт №27)
      loadManagersFromStorage();
      // Восстанавливаем журнал действий из unitest_audit (Промт №29)
      loadAuditLogsFromStorage();
      // Восстанавливаем прочитанные уведомления из unitestreadnotifications (Промт №30)
      loadReadNotificationsFromStorage();
      // Восстанавливаем апелляции студента из unitest_appeals (Промт №33)
      loadAppealsFromStorage();
      // Демо-тесты (формулы и схемы) — только при открытии через file://
      ensureFormulaDemoTest();
      ensureDiagramDemoTest();

      // Навешиваем обработчики:
      // 1) Кнопки переключения темы (в шапке входа И в шапке панели)
      document.getElementById('themeToggle').addEventListener('click', switchTheme);
      document.getElementById('themeTogglePanel').addEventListener('click', switchTheme);

      // 2) Кнопки переключения языка (оба переключателя — .lang-btn)
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => changeLanguage(btn.dataset.lang));
      });

      // 3) Карточки ролей на экране входа
      document.querySelectorAll('.role-card').forEach(card => {
        card.addEventListener('click', () => selectRole(card.dataset.role));
      });

      // 4) Кнопка «Выйти» в sidebar
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // 5) Бургер-меню и затемнение (мобильные)
      document.getElementById('burgerBtn').addEventListener('click', toggleSidebar);
      document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

      // 6) Колокольчик уведомлений + выпадающая панель (Промт №9, глобально — №30)
      document.getElementById('bellBtn').addEventListener('click', toggleNotifications);
      document.getElementById('notifReadAll').addEventListener('click', markAllRead);

      // 6.1) Клик по новости/событию открывает статью или подробности (Промт №9.1)
      const notifList = document.getElementById('notifList');
      const pickNotif = (e) => (e.target && e.target.closest ? e.target.closest('[data-notif-id]') : null);

      notifList.addEventListener('click', (e) => {
        const el = pickNotif(e);
        if (el) openNotifDetail(el.dataset.notifId);
      });
      notifList.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const el = pickNotif(e);
        if (el) { e.preventDefault(); openNotifDetail(el.dataset.notifId); }
      });

      // 6.2) Модальное окно подробностей: закрытие по кнопке, по фону и по Esc
      document.getElementById('notifModalClose').addEventListener('click', closeNotifDetail);
      document.getElementById('notifModal').addEventListener('click', (e) => {
        if (e.target && e.target.closest && e.target.closest('[data-notif-close]')) closeNotifDetail();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeNotifDetail();
      });

      // Клик вне панели уведомлений — закрываем её (самопроверка №3)
      document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.bell-wrap');
        const dd = document.getElementById('notifDropdown');
        if (!wrap || !dd || dd.classList.contains('hidden')) return;
        if (!wrap.contains(e.target)) closeNotifications();
      });

      // Первичный рендер уведомлений и красной точки
      renderNotifications();
      updateBellDot();

      // 6.3) Глобальный поиск: кнопка, Ctrl/Cmd+K, ввод, результаты (Промт №31)
      document.getElementById('searchBtn').addEventListener('click', toggleSearch);
      document.getElementById('searchClose').addEventListener('click', closeSearch);

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', () => performSearch(searchInput.value));

      const searchResults = document.getElementById('searchResults');
      searchResults.addEventListener('click', (e) => {
        const el = e.target && e.target.closest ? e.target.closest('[data-search-label]') : null;
        if (!el) return;
        const dict = translations[currentLang];
        alert(`${dict.searchOpenDev}: ${el.dataset.searchLabel} ${dict.searchInDev}`);
      });

      // Горячая клавиша Ctrl/Cmd+K (работает и в русской раскладке через e.code)
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (String(e.key).toLowerCase() === 'k' || e.code === 'KeyK')) {
          e.preventDefault();
          toggleSearch();
        } else if (e.key === 'Escape') {
          closeSearch();
        }
      });

      // Клик вне панели поиска — закрываем и очищаем поле
      document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.search-wrap');
        const dd = document.getElementById('searchDropdown');
        if (!wrap || !dd || dd.classList.contains('hidden')) return;
        if (!wrap.contains(e.target)) closeSearch();
      });

      // 7) Экран прохождения теста: навигация и завершение
      document.getElementById('testPrevBtn').addEventListener('click', () => goToQuestion(-1));
      document.getElementById('testNextBtn').addEventListener('click', () => goToQuestion(1));
      document.getElementById('testFinishBtn').addEventListener('click', finishTest);
      document.getElementById('testCloseBtn').addEventListener('click', closeTestScreen);

      console.log("Приложение инициализировано. Язык:", currentLang, "| Тема:", currentTheme);
    }

    // Запуск после полной загрузки DOM
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
