    // Закрывает модалку и снимает Esc-обработчик (как в модалке групп).
    function closeAdminUserModal() {
      const overlay = document.getElementById('adminAddUserOverlay');
      if (overlay) overlay.remove();
      document.removeEventListener('keydown', adminUserModalKeydown);
    }

    function adminUserModalKeydown(e) {
      if (e.key === 'Escape') closeAdminUserModal();
    }

    // Показывает поля выбранной роли и сбрасывает невидимые значения.
    function syncAdminUserFields(role) {
      const studentFields = document.getElementById('adminStudentFields');
      const teacherFields = document.getElementById('adminTeacherFields');
      const groupSelect = document.getElementById('adminNewUserGroup');
      const courseInput = document.getElementById('adminNewUserCourse');
      const formSelect = document.getElementById('adminNewUserForm');
      const categorySelect = document.getElementById('adminNewUserCategory');
      const subjectInput = document.getElementById('adminNewUserSubject');
      if (!studentFields || !teacherFields) return;

      const isStudent = role !== 'teacher';
      studentFields.hidden = !isStudent;
      teacherFields.hidden = isStudent;

      // При смене роли значения скрытых полей сбрасываются.
      if (groupSelect) groupSelect.value = '';
      if (courseInput) courseInput.value = '1';
      if (formSelect) formSelect.value = 'full';
      if (categorySelect) categorySelect.value = 'archer';
      if (subjectInput) subjectInput.value = '';
    }

    // Валидация и сохранение нового пользователя (студент или преподаватель).
    function saveAdminUser() {
      const dict = translations[currentLang];
      const roleSelect = document.getElementById('adminNewUserRole');
      const nameInput = document.getElementById('adminNewUserName');
      const groupSelect = document.getElementById('adminNewUserGroup');
      const courseInput = document.getElementById('adminNewUserCourse');
      const formSelect = document.getElementById('adminNewUserForm');
      const categorySelect = document.getElementById('adminNewUserCategory');
      const subjectInput = document.getElementById('adminNewUserSubject');
      if (!roleSelect || !nameInput) return;

      const role = roleSelect.value === 'teacher' ? 'teacher' : 'student';
      const name = (nameInput.value || '').trim();
      if (!name) { alert(dict.adminErrUserName); nameInput.focus(); return; }

      let newUser = null;
      if (role === 'student') {
        const group = groupSelect ? groupSelect.value : '';
        const course = courseInput ? Number(courseInput.value) : 0;
        if (!group) { alert(dict.adminErrUserGroup); if (groupSelect) groupSelect.focus(); return; }
        if (!course || course < 1 || course > 5) {
          alert(dict.adminErrGroupCourse);
          if (courseInput) courseInput.focus();
          return;
        }
        newUser = {
          id: 's_' + Date.now(),
          name,
          group,
          course,
          form: formSelect && formSelect.value === 'part' ? 'part' : 'full',
          category: categorySelect && categorySelect.value === 'regular' ? 'regular' : 'archer'
        };
        mockAllStudents.push(newUser);
      } else {
        const subject = subjectInput ? (subjectInput.value || '').trim() : '';
        if (!subject) { alert(dict.adminErrUserSubject); if (subjectInput) subjectInput.focus(); return; }
        newUser = { id: 't_' + Date.now(), name, subject };
        mockAllTeachers.push(newUser);
      }

      saveAdminUsersToStorage();                       // uniteststudents + unitestteachers
      // Логи самопроверки — как в промте (не UI, поэтому без перевода).
      console.log("Пользователь создан:", newUser);
      addSystemLog(mockAdmin.name, 'adminLogUserAdded', [newUser.name]);
      if (role === 'student') {
        console.log("Всего студентов теперь:", mockAllStudents.length);
      } else {
        console.log("Всего преподавателей теперь:", mockAllTeachers.length);
      }

      closeAdminUserModal();
      allUsers = getAdminAllUsers();
      if (currentRole === 'admin' && currentSection === 'users') {
        navigate('users', false);                      // таблица и карточки перерисовываются
      }
    }

    // Сохранение назначения: один менеджер ведёт только одно направление.
    function saveAdminManager() {
      const dict = translations[currentLang];
      const select = document.getElementById('adminManagerSelect');
      const direction = adminManagerDirection;
      if (!select || !direction) return;

      const value = select.value;
      if (!value) { alert(dict.adminErrManager); select.focus(); return; }
      const managers = Array.isArray(mockAllManagers) ? mockAllManagers : [];

      if (value === '__free__') {
        let freed = null;
        managers.forEach(m => {
          if (m && m.direction === direction) {
            m.direction = null;
            freed = m;
          }
        });
        if (freed) {
          console.log("Должность освобождена:", adminDirectionLabel(direction), "—", freed.name);
          addSystemLog(mockAdmin.name, 'adminLogManagerFreed', ['@dir' + capitalize(direction)]);
        } else {
          console.log("Должность уже свободна:", adminDirectionLabel(direction));
        }
      } else {
        const manager = managers.find(m => m && String(m.id) === String(value));
        if (!manager) { closeAdminManagerModal(); return; }

        // Менеджер уходит с прежнего направления — там он больше не числится.
        if (manager.direction && manager.direction !== direction) {
          console.log("Менеджер", manager.name, "переведен с направления", adminDirectionLabel(manager.direction));
        }
        // На направлении остаётся один менеджер: прежнего снимаем.
        managers.forEach(m => {
          if (m && m !== manager && m.direction === direction) m.direction = null;
        });
        manager.direction = direction;
        console.log("Менеджер", manager.name, "назначен на", adminDirectionLabel(direction));
        addSystemLog(mockAdmin.name, 'adminLogManagerAssigned',
          [manager.name, '@dir' + capitalize(direction)]);
      }

      syncMockManagerFromList();
      saveManagersToStorage();
      console.log("Обновленный список менеджеров:", mockAllManagers);

      closeAdminManagerModal();
      if (currentRole === 'admin' && currentSection === 'managers') {
        navigate('managers', false);                // таблица/карточки перерисовываются
      }
    }

    /* ============================================================
       ПАНЕЛЬ АДМИНИСТРАТОРА: ГЛОБАЛЬНЫЕ ОТЧЁТЫ (Промт №28)
       ============================================================ */
    // Исторические результаты хранят группу кириллицей («101-ПР»),
    // справочник групп — латиницей («101-PR»). Приводим к одному виду.
    function adminReportGroupKey(name) {
      return String(name || '').replace(/ПР/g, 'PR').replace(/ДЗ/g, 'DZ');
    }

    // Все результаты вуза: исторические + сохранённые (unitest_results),
    // нормализованные так же, как в панели менеджера/преподавателя.
    function adminReportAllResults() {
      const historical = Array.isArray(mockHistoricalResults) ? mockHistoricalResults : [];
      const saved = getResults();
      return historical.map(normalizeResult).concat(saved.map(normalizeResult));
    }

    // Опции фильтра «Курс»: «Все курсы» + 1…5.
    function adminReportCourseOptions(selected) {
      const dict = translations[currentLang];
      let html = `<option value="">${escapeHtml(dict.adminReportsAllCourses)}</option>`;
      for (let course = 1; course <= 5; course++) {
        const sel = String(selected) === String(course) ? ' selected' : '';
        html += `<option value="${course}"${sel}>${course} ${escapeHtml(dict.courseSuffix)}</option>`;
      }
      return html;
    }

    // Опции фильтра «Направление»: «Все направления» + уникальные из групп.
    function adminReportDirectionOptions(groups, selected) {
      const dict = translations[currentLang];
      const keys = [];
      groups.forEach(group => {
        if (group && group.direction && !keys.includes(group.direction)) keys.push(group.direction);
      });
      let html = `<option value="">${escapeHtml(dict.adminReportsAllDirections)}</option>`;
      keys.forEach(key => {
        const sel = selected === key ? ' selected' : '';
        html += `<option value="${escapeHtml(key)}"${sel}>${escapeHtml(adminDirectionLabel(key))}</option>`;
      });
      return html;
    }

    function adminReportBarHTML(row) {

    // Пересчитывает карточки и таблицу по выбранным курсу и направлению.
    function applyAdminReportFilters() {
      const dict = translations[currentLang];
      const courseEl = document.getElementById('adminReportCourse');
      const directionEl = document.getElementById('adminReportDirection');
      const selectedCourse = courseEl ? courseEl.value : '';
      const selectedDirection = directionEl ? directionEl.value : '';
      console.log("Применены фильтры. Курс:", selectedCourse || 'all',
        "Направление:", selectedDirection || 'all');

      // 1. Группы под фильтром
      const allGroups = Array.isArray(mockTeacherGroups) ? mockTeacherGroups : [];
      const groups = allGroups.filter(group => group
        && (!selectedCourse || String(group.course) === String(selectedCourse))
        && (!selectedDirection || group.direction === selectedDirection));

      // 2. Результаты только этих групп (нормализация «ПР» → «PR»)
      const groupKeys = groups.map(group => adminReportGroupKey(group.name));
      const allResults = adminReportAllResults();
      const results = allResults.filter(result =>
        groupKeys.includes(adminReportGroupKey(result.studentGroup)));

      // 3. Средний балл по вузу (в рамках фильтра)
      const grades = results
        .map(result => Number(result.grade))
        .filter(grade => Number.isFinite(grade));
      const globalAvg = grades.length
        ? grades.reduce((sum, grade) => sum + grade, 0) / grades.length
        : 0;
      console.log("Общий средний балл по вузу:", grades.length ? Number(globalAvg.toFixed(2)) : 0);

      const stats = document.getElementById('adminReportStats');
      if (stats) {
        stats.innerHTML = `
          <div class="stat-card">
            <i class="fas fa-file-circle-check"></i>
            <div class="stat-value">${results.length}</div>
            <div class="stat-label">${escapeHtml(dict.adminReportsTotalPassed)}</div>
          </div>
          <div class="stat-card">
            <i class="fas fa-star-half-stroke"></i>
            <div class="stat-value">${grades.length ? globalAvg.toFixed(2) : '—'}</div>
            <div class="stat-label">${escapeHtml(dict.adminReportsGlobalAvg)}</div>
          </div>`;
      }

      const tableBox = document.getElementById('adminReportTable');
      if (!tableBox) return;

      if (!groups.length) {
        tableBox.innerHTML = `
          <div class="content-placeholder">
            <i class="fas fa-filter-circle-xmark"></i>
            <span>${escapeHtml(dict.adminReportsNoGroups)}</span>
          </div>`;
        return;
      }

      // 4. Строка на каждую группу: средний балл и число результатов
      const rows = groups.map(group => {
        const groupResults = results.filter(result =>
          adminReportGroupKey(result.studentGroup) === adminReportGroupKey(group.name));
        const groupGrades = groupResults
          .map(result => Number(result.grade))
          .filter(grade => Number.isFinite(grade));
        const avgGrade = groupGrades.length
          ? groupGrades.reduce((sum, grade) => sum + grade, 0) / groupGrades.length
          : 0;
        console.log("Группа:", group.name, "Средний балл:",
          avgGrade ? Number(avgGrade.toFixed(2)) : 0, "Результатов:", groupResults.length);

        const pct = groupGrades.length
          ? Math.max(0, Math.min(100, (avgGrade / 5) * 100))
          : 0;
        const tone = !groupGrades.length ? 'gray'
          : avgGrade > 4.5 ? 'green'
          : avgGrade > 3.5 ? 'blue'
          : 'orange';

        return { group, avgGrade, count: groupResults.length, pct, tone };
      });

      tableBox.innerHTML = `
        <div class="results-table-wrap admin-reports-table-wrap">
          <table class="results-table admin-reports-table">
            <thead>
              <tr>
                <th>${escapeHtml(dict.adminReportsGroup)}</th>
                <th>${escapeHtml(dict.adminGroupCourse)}</th>
                <th>${escapeHtml(dict.adminGroupDirection)}</th>
                <th>${escapeHtml(dict.adminReportsStudents)}</th>
                <th>${escapeHtml(dict.avgGrade)}</th>
                <th>${escapeHtml(dict.adminReportsPerformance)}</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td><strong>${escapeHtml(row.group.name)}</strong></td>
                  <td>${escapeHtml(String(row.group.course))} ${escapeHtml(dict.courseSuffix)}</td>
                  <td>${escapeHtml(adminDirectionLabel(row.group.direction))}</td>
                  <td>${adminGroupStudentCount(row.group)}</td>
                  <td>${row.count ? row.avgGrade.toFixed(2) : escapeHtml(dict.adminReportsNoData)}</td>
                  <td>${adminReportBarHTML(row)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="results-cards admin-report-cards">
          ${rows.map(row => `
            <article class="results-card admin-report-card">
              <div class="results-card-top">
                <span class="results-card-name">${escapeHtml(row.group.name)}</span>
                <span class="course-badge">${escapeHtml(String(row.group.course))} ${escapeHtml(dict.courseSuffix)}</span>
              </div>
              <div class="results-card-row">
                <i class="fas fa-compass-drafting"></i>${escapeHtml(adminDirectionLabel(row.group.direction))}
              </div>
              <div class="results-card-row">
                <i class="fas fa-user-group"></i>${adminGroupStudentCount(row.group)} ${escapeHtml(studentsWord(adminGroupStudentCount(row.group)))}
              </div>
              <div class="report-stats">
                <div class="report-stat">
                  <span>${escapeHtml(dict.avgGrade)}</span>
                  <strong>${row.count ? row.avgGrade.toFixed(2) : escapeHtml(dict.adminReportsNoData)}</strong>
                </div>
                <div class="report-stat">
                  <span>${escapeHtml(dict.testsPassed)}</span>
                  <strong>${row.count}</strong>
                </div>
              </div>
              ${adminReportBarHTML(row)}
            </article>`).join('')}
        </div>`;
    }

    // Обработчики раздела «Настройки».
    function bindAdminSettings() {
      const saveBtn = document.getElementById('adminSettingsSave');
      const backupBtn = document.getElementById('adminBackupBtn');
      const resetBtn = document.getElementById('adminResetDb');
      const clearBtn = document.getElementById('adminClearLogs');

      if (saveBtn) saveBtn.addEventListener('click', saveAdminSettings);
      if (backupBtn) backupBtn.addEventListener('click', downloadAdminBackup);
      if (resetBtn) resetBtn.addEventListener('click', resetAdminDatabase);
      if (clearBtn) clearBtn.addEventListener('click', clearAdminLogs);
    }

    // Сохранение системных настроек + применение выбранных языка/темы.
    function saveAdminSettings() {
      const dict = translations[currentLang];
      const nameEl = document.getElementById('adminSettingsName');
      const yearEl = document.getElementById('adminSettingsYear');
      const langEl = document.getElementById('adminSettingsLang');
      const themeEl = document.getElementById('adminSettingsTheme');
      const statusEl = document.getElementById('adminSettingsStatus');
      if (!nameEl || !yearEl) return;

      const university = (nameEl.value || '').trim();
      const academicYear = (yearEl.value || '').trim();
      const setStatus = (text, isError) => {
        if (!statusEl) return;
        statusEl.textContent = text;
        statusEl.classList.toggle('admin-settings-status--error', !!isError);
        statusEl.classList.toggle('admin-settings-status--ok', !isError);
      };

      if (!university) { setStatus(dict.adminErrSettingsName, true); nameEl.focus(); return; }
      if (!academicYear) { setStatus(dict.adminErrSettingsYear, true); yearEl.focus(); return; }

      const language = langEl && ['ru', 'uz', 'en'].includes(langEl.value) ? langEl.value : currentLang;
      const theme = themeEl && themeEl.value === 'dark' ? 'dark' : 'light';
      const langChanged = language !== currentLang;
      const themeChanged = theme !== currentTheme;

      systemSettings = { university, academicYear, language, theme };
      if (!saveAdminSettingsToStorage()) {
        setStatus(dict.storageFull || dict.adminBackupError, true);
        return;
      }

      addSystemLog(mockAdmin.name, 'adminLogSettingsChanged', []);
      console.log("Системные настройки сохранены:", systemSettings);

      // Применяем выбранные язык/тему сразу (они же станут значениями по умолчанию).
      if (langChanged) changeLanguage(language);
      if (themeChanged) switchTheme();
      if (currentRole === 'admin' && currentSection === 'settings') navigate('settings', false);

      const freshStatus = document.getElementById('adminSettingsStatus');
      const freshDict = translations[currentLang];
      if (freshStatus) {
        freshStatus.textContent = freshDict.adminSettingsSaved;
        freshStatus.classList.remove('admin-settings-status--error');
        freshStatus.classList.add('admin-settings-status--ok');
      }
    }

    // Полный набор данных для резервной копии: все ключи unitest* + настройки и журнал.
    function adminBackupData() {
      const data = {
        app: 'UniTest',
        schemaVersion: 1,
        exportedAt: new Date().toISOString(),
        settings: { ...systemSettings },
        logs: systemLogs.map(entry => ({ ...entry, args: (entry.args || []).slice() })),
        storage: {}
      };
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || key.indexOf('unitest') !== 0) continue;
          const raw = localStorage.getItem(key);
          try { data.storage[key] = JSON.parse(raw); }
          catch (e) { data.storage[key] = raw; }
        }
      } catch (e) {
        console.error("Не удалось собрать данные для резервной копии:", e);
      }
      return data;
    }

    // Реальное скачивание файла (Blob → ссылка; data URI — фолбэк для jsdom).
    function triggerAdminDownload(filename, text) {
      let url = '';
      try {
        if (typeof Blob !== 'undefined' && typeof URL !== 'undefined' &&
            typeof URL.createObjectURL === 'function') {
          url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
        }
      } catch (e) {
        url = '';
      }
      if (!url) {
        url = 'data:application/json;charset=utf-8,' + encodeURIComponent(text);
      }

      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.rel = 'noopener';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      if (link.parentNode) link.parentNode.removeChild(link);

      if (url.indexOf('blob:') === 0 && typeof URL !== 'undefined' &&
          typeof URL.revokeObjectURL === 'function') {
        setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 1000);
      }
    }

    // Скачивание резервной копии в JSON.
    function downloadAdminBackup() {
      const dict = translations[currentLang];
      const statusEl = document.getElementById('adminBackupStatus');
      let json = '';
      try {
        json = JSON.stringify(adminBackupData(), null, 2);
      } catch (e) {
        console.error("Не удалось сериализовать резервную копию:", e);
        if (statusEl) {
          statusEl.textContent = dict.adminBackupError;
          statusEl.className = 'admin-settings-status admin-settings-status--error';
        }
        return;
      }

      const date = new Date().toISOString().slice(0, 10);
      const filename = 'unitest-backup-' + date + '.json';
      try {
        triggerAdminDownload(filename, json);
      } catch (e) {
        console.error("Не удалось скачать резервную копию:", e);
        if (statusEl) {
          statusEl.textContent = dict.adminBackupError;
          statusEl.className = 'admin-settings-status admin-settings-status--error';
        }
        return;
      }

      addSystemLog(mockAdmin.name, 'adminLogBackup', [filename]);
      console.log("Резервная копия сформирована:", filename);
      if (statusEl) {
        statusEl.textContent = dict.adminBackupDone + ' ' + filename;
        statusEl.className = 'admin-settings-status admin-settings-status--ok';
      }
    }

    // Валидация и сохранение группы (создание или обновление).
    function saveAdminGroup() {
      const dict = translations[currentLang];
      const nameInput = document.getElementById('adminGroupName');
      const courseSelect = document.getElementById('adminGroupCourse');
      const directionSelect = document.getElementById('adminGroupDirection');
      const formSelect = document.getElementById('adminGroupForm');
      if (!nameInput || !courseSelect || !directionSelect || !formSelect) return;

      const name = (nameInput.value || '').trim();
      const course = Number(courseSelect.value);
      const direction = directionSelect.value;
      const form = formSelect.value === 'part' ? 'part' : 'full';

      if (!name) { alert(dict.adminErrGroupName); nameInput.focus(); return; }
      if (!course || course < 1 || course > 5) { alert(dict.adminErrGroupCourse); courseSelect.focus(); return; }
      if (!direction) { alert(dict.adminErrGroupDirection); directionSelect.focus(); return; }

      const duplicate = mockTeacherGroups.some(g =>
        g && String(g.id) !== String(adminGroupEditingId) &&
        String(g.name).toLowerCase() === name.toLowerCase()
      );
      if (duplicate) { alert(dict.adminErrGroupDuplicate); nameInput.focus(); return; }

      if (adminGroupEditingId != null) {
        const group = mockTeacherGroups.find(g => String(g.id) === String(adminGroupEditingId));
        if (group) {
          group.name = name;
          group.course = course;
          group.direction = direction;
          group.form = form;
          console.log("Группа обновлена:", group.name, "Направление:", group.direction);
          addSystemLog(mockAdmin.name, 'adminLogGroupUpdated', [group.name]);
        }
      } else {
        const newGroup = {
          id: 'g_' + Date.now(),
          name,
          course,
          direction,
          form,
          studentsCount: 0,
          teacherId: null
        };
        mockTeacherGroups.push(newGroup);
        console.log("Группа создана:", newGroup.name, "Направление:", newGroup.direction);
        addSystemLog(mockAdmin.name, 'adminLogGroupCreated', [newGroup.name]);
      }

      saveGroupsToStorage();                            // ключ unitest_groups

      if (currentRole === 'admin' && currentSection === 'groups') {

    function collectGroupGrades(group) {
      const norm = s => String(s || '').replace(/ПР/g, 'PR').replace(/ДЗ/g, 'DZ');
      const historical = mockHistoricalResults
        .filter(r => norm(r.studentGroup) === group.name)
        .map(r => r.grade)
        .filter(g => typeof g === 'number');

      const saved = getResults().map(r => {
        const test = mockTests.find(t => String(t.id) === String(r.testId));
        if (!test) return null;
        const groups = Array.isArray(test.targetGroup) ? test.targetGroup : [test.targetGroup];
        if (!groups.includes(group.name)) return null;
        if (typeof r.grade === 'number') return r.grade;
        let percent = typeof r.percent === 'number' ? r.percent : null;
        if (percent === null && r.total) {
          const correct = typeof r.correct === 'number' ? r.correct : r.score;
          if (typeof correct === 'number') percent = (correct / r.total) * 100;
        }
        if (percent !== null) return Math.max(2, Math.min(5, Math.round(percent / 20)));
        return null;
      }).filter(g => typeof g === 'number');

      return [...historical, ...saved];
    }

    // Правильная форма слова «студент» для числа.
    // ru — склонение (1 студент / 2 студента / 5 студентов), en — 1/много, uz — без изменений.
    function studentsWord(n) {
      const dict = translations[currentLang];
      if (currentLang === 'ru') {
        const m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return dict.studentOne;
        if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return dict.studentFew;
        return dict.studentMany;
      }
      if (currentLang === 'en') return n === 1 ? dict.studentOne : dict.studentFew;
      return dict.studentOne;                     // uz — форма не меняется
    }

    // Черновик создаваемого теста. Заполняется здесь, вопросы — в промте №13.

    // Обработчики формы: смена курса (перерисовка групп), отмена, «Далее»
    function bindCreateTestForm() {

    // Вопросы текущего теста: у тестов, созданных преподавателем (Промт №14), есть
    // свой массив questions из конструктора; у демо-тестов — общие mockQuestions.
    function activeQuestions() {
      if (activeTest && Array.isArray(activeTest.questions) && activeTest.questions.length) {
        return activeTest.questions;
      }
      return mockQuestions;
    }

    // Запуск теста: скрывает список, открывает экран прохождения
    function startTest(testId) {
      // id бывает числом (демо-тесты) или строкой 'test_...' (Промт №14) —
      // сравниваем в строковом виде, чтобы оба варианта находились
      const test = mockTests.find(t => String(t.id) === String(testId));
      if (!test) {
        console.error("Тест не найден:", testId);
        return;
      }
      activeTest = test;
      currentQuestionIndex = 0;
      userAnswers = new Array(activeQuestions().length).fill(null);  // ответы пустые
      secondsLeft = test.timeLimit * 60;                         // полное время теста

      // Открываем полноэкранный экран теста (и прячем возможный экран прошлого результата)
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('testScreen').classList.remove('hidden');
      document.body.style.overflow = 'hidden';                  // блокируем фон

      // Пробуем восстановить незавершённый прогресс (Промт №6).
      // Передаём test.id (нормализованный id из базы), чтобы compare в
      // restoreProgress сработал и для числовых, и для строковых id.
      restoreProgress(test.id);

      renderQuestion();
      startTimer(secondsLeft);                                   // запускаем обратный отсчёт

      console.log("Запуск теста:", testId);
    }

    /* ============================================================
       5.3 ЭКРАН ПРОХОЖДЕНИЯ ТЕСТА (Промт №5)
       ============================================================ */
    // Отрисовывает текущий вопрос, варианты, прогресс и состояние кнопок
    function renderQuestion() {
      const dict = translations[currentLang];
      const total = activeQuestions().length;
      const q = activeQuestions()[currentQuestionIndex];

      // Шапка: название теста и таймер (текст)
      document.getElementById('testTitle').textContent = testTitle(activeTest);
      updateTimerDisplay();                                      // показываем текущее время MM:SS

      // Прогресс-бар: заполненность зависит от текущего вопроса
      document.getElementById('testProgressFill').style.width =
        (((currentQuestionIndex + 1) / total) * 100) + "%";

      // Счётчик «Вопрос X из Y»
      document.getElementById('testQCount').textContent =
        `${dict.qWord} ${currentQuestionIndex + 1} ${dict.qOf} ${total}`;

      // Текст вопроса + схема (если есть)
      document.getElementById('testQuestionText').textContent = q.text;
      document.getElementById('testDiagram').innerHTML = renderQuestionDiagram(q);

      // Варианты ответа (A, B, C, D...). Уже выбранный — активен (самопроверка №3)
      const letters = ["A", "B", "C", "D", "E", "F"];
      document.getElementById('testOptions').innerHTML = q.options.map((opt, i) => {
        const selected = userAnswers[currentQuestionIndex] === i;
        return `
          <button class="test-option${selected ? ' selected' : ''}" data-index="${i}">
            <span class="option-letter">${letters[i] || (i + 1)}</span>
            <span class="option-text">${opt}</span>
            <i class="fas fa-circle-check option-check"></i>
          </button>`;
      }).join('');

      // Клики по вариантам
      document.querySelectorAll('#testOptions .test-option').forEach(btn => {
        btn.addEventListener('click', () => selectAnswer(Number(btn.dataset.index)));
      });

      // Кнопки «Назад» / «Далее»: неактивны на краях
      const prev = document.getElementById('testPrevBtn');
      const next = document.getElementById('testNextBtn');
      prev.disabled = currentQuestionIndex === 0;
      next.disabled = currentQuestionIndex === total - 1;

      // Формулы в тексте вопроса и вариантах ($...$ / $$...$$)
      renderMath(document.getElementById('testScreen'));
    }

    // Выбор ответа (самопроверка: логи индекса и массива)
    function selectAnswer(index) {
      userAnswers[currentQuestionIndex] = index;
      console.log("Выбран ответ:", index, "для вопроса:", currentQuestionIndex);
      console.log("Текущий массив ответов:", userAnswers);

      // Обновляем подсветку без полной перерисовки
      document.querySelectorAll('#testOptions .test-option').forEach(btn => {
        btn.classList.toggle('selected', Number(btn.dataset.index) === index);
      });

      saveProgress();                                            // автосохранение прогресса (Промт №6)
    }

    // Переход к вопросу (delta: -1 назад, +1 вперёд)
    function goToQuestion(delta) {
      const total = activeQuestions().length;
      const nextIndex = Math.min(Math.max(currentQuestionIndex + delta, 0), total - 1);
      if (nextIndex === currentQuestionIndex) return;             // край — никуда не идём
      currentQuestionIndex = nextIndex;
      // Самопроверка: лог перехода (до отрисовки, чтобы показать новый индекс)
      console.log("Переход к вопросу с индексом:", currentQuestionIndex);
      renderQuestion();                                           // ранее выбранный ответ станет активным
      saveProgress();                                            // автосохранение прогресса (Промт №6)
    }

    // «Завершить» — останавливаем таймер, считаем результат и показываем экран результата
    function finishTest() {
      stopTimer();                                               // таймер просто останавливается
      clearProgress();                                           // чистим автосохранение

      const res = calcResult();                                  // подсчёт результата
      const saved = saveResult(res);                             // сохранение в localStorage
      if (saved && saved.id) res.id = saved.id;                  // id нужен для привязки апелляции

      // Прячем экран теста и показываем экран результата
      document.getElementById('testScreen').classList.add('hidden');
      renderResult(res);
    }

    // Закрыть экран теста и вернуться к списку
    function closeTestScreen() {
      stopTimer();                                               // глушим таймер (Промт №6)
      clearProgress();                                           // чистим сохранение (Промт №6)
      document.getElementById('testScreen').classList.add('hidden');
      document.body.style.overflow = '';                          // возвращаем прокрутку
      activeTest = null;
      currentQuestionIndex = 0;
      userAnswers = [];
      console.log("Экран теста закрыт.");
    }

    /* ============================================================
       5.4 ТАЙМЕР И АВТОСОХРАНЕНИЕ (Промт №6)
       ============================================================ */
    // Форматирует секунды в строку MM:SS
    function formatTime(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(safe / 60);
      const s = safe % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    // Обновляет текст таймера в шапке экрана теста
    function updateTimerDisplay() {
      const el = document.getElementById('testTimer');
      if (el) el.innerHTML = `<i class="fas fa-clock"></i> ${formatTime(secondsLeft)}`;
    }

    // Запускает обратный отсчёт на seconds секунд
    function startTimer(seconds) {
      stopTimer();                        // на случай повторного запуска
      secondsLeft = seconds;
      updateTimerDisplay();
      timerId = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();

        // Автосохранение каждые 5 секунд работы таймера
        if (secondsLeft % 5 === 0) saveProgress();

        // Не позволяем таймеру уйти в минус
        if (secondsLeft <= 0) {
          secondsLeft = 0;
          stopTimer();
          alert("Время вышло!");
        }
      }, 1000);
      console.log("Таймер запущен на", seconds, "секунд");
    }

    // Останавливает таймер
    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // Сохраняет прогресс незавершённого теста в localStorage
    function saveProgress() {
      if (!activeTest) return;
      const data = {
        testId: activeTest.id,
        answers: userAnswers,
        index: currentQuestionIndex,
        timeLeft: secondsLeft
      };
      localStorage.setItem(ACTIVE_TEST_KEY, JSON.stringify(data));
      console.log("Прогресс сохранён в localStorage:", { testId: activeTest.id, timeLeft: secondsLeft });
    }

    // Удаляет сохранённый прогресс
    function clearProgress() {
      localStorage.removeItem(ACTIVE_TEST_KEY);
    }

    // Пытается восстановить прогресс для теста testId. Возвращает true при успехе.
    function restoreProgress(testId) {
      const raw = localStorage.getItem(ACTIVE_TEST_KEY);
      if (!raw) return false;

      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        console.error("Повреждённое сохранение, удаляю:", e);
        clearProgress();
        return false;
      }
      if (!data || data.testId !== testId) return false;         // сохранение от другого теста

      // Спрашиваем пользователя, продолжать ли
      if (!confirm("Найдено сохранение. Продолжить с места остановки?")) {
        clearProgress();
        console.log("Сохранение отклонено — начинаем заново.");
        return false;
      }

      // Восстанавливаем ответы (выравниваем длину под текущий набор вопросов)
      userAnswers = Array.isArray(data.answers) ? data.answers.slice() : [];
      while (userAnswers.length < activeQuestions().length) userAnswers.push(null);
      userAnswers.length = activeQuestions().length;

      currentQuestionIndex = Number.isInteger(data.index) ? data.index : 0;
      if (currentQuestionIndex < 0 || currentQuestionIndex >= activeQuestions().length) currentQuestionIndex = 0;

      secondsLeft = Number.isFinite(data.timeLeft) ? data.timeLeft : activeTest.timeLimit * 60;

      console.log("Прогресс восстановлен. Ответы:", userAnswers);
      return true;
    }

    /* ============================================================
       5.5 ЭКРАН РЕЗУЛЬТАТА ТЕСТА (Промт №7)
       ============================================================ */
    // Форматирует дату в DD.MM.YYYY (принимает Date или строку YYYY-MM-DD)
    function formatDate(d) {
      if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
        const [y, m, day] = d.split("-");
        return `${day}.${m}.${y}`;
      }
      const date = (d instanceof Date) ? d : new Date();
      const day = String(date.getDate()).padStart(2, "0");
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `${day}.${m}.${date.getFullYear()}`;
    }

    // Считает результат: правильные ответы, процент, оценку
    function calcResult() {
      const total = activeQuestions().length;
      let correctCount = 0;

      // Сравниваем ответы студента с правильными индексами
      activeQuestions().forEach((q, i) => {
        if (userAnswers[i] === q.correct) correctCount++;
      });

      const percent = total ? Math.round((correctCount / total) * 100) : 0;

      // Шкала оценок
      let grade = 2;
      if (percent >= 90) grade = 5;
      else if (percent >= 75) grade = 4;
      else if (percent >= 60) grade = 3;

      // Время прохождения = лимит минус оставшееся время
      const limit = activeTest ? activeTest.timeLimit * 60 : 0;
      const timeSpent = Math.max(0, limit - secondsLeft);

      // Самопроверка
      console.log("Подсчет результатов. Правильных:", correctCount, "из", total, "Процент:", percent, "Оценка:", grade);

      return {
        testId: activeTest ? activeTest.id : null,
        testTitle: activeTest ? testTitle(activeTest) : "—",
        correct: correctCount,
        total,
        percent,
        grade,
        timeSpent,
        date: new Date().toISOString().slice(0, 10)
      };
    }

    // Сохраняет результат в localStorage (массив под ключом unitest_results)
    function saveResult(res) {
      const results = getResults();
      const record = {
        // Промт №33: стабильный id результата — к нему привязывается апелляция
        id: "res_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        testId: res.testId,
        testTitle: res.testTitle,
        score: res.correct,            // количество правильных (score)
        correct: res.correct,
        total: res.total,
        percent: res.percent,
        grade: res.grade,
        timeSpent: res.timeSpent || 0,
        date: res.date,
        answers: userAnswers.slice()
      };
      results.push(record);
      localStorage.setItem(RESULTS_KEY, JSON.stringify(results));
      console.log("Результат сохранён в localStorage:", record);
      return record;
    }

    /* ============================================================
       5.9.1 СОЗДАНИЕ ТЕСТА. ШАГ 2: КОНСТРУКТОР ВОПРОСОВ (Промт №13)
       ============================================================ */
    /* ============================================================
       5.13 СХЕМЫ К ВОПРОСАМ: SVG-генератор + модалка (запрос пользователя)
       ============================================================ */
    let pendingDiagram = null;
    let currentDiagramDraft = null;
    let currentDiagramImage = null;
    let diagramEditingIndex = null;

    function svgEsc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const dgNum = (v, d = 0) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    };

    function diagramFrame(inner, attrs = '') {
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" class="diagram-svg" role="img" ${attrs}>
        <rect class="dg-bg" x="0" y="0" width="480" height="320" rx="12"/>${inner}
      </svg>`;
    }

    function diagramStep(range) {
      const raw = Math.max(0.2, range / 8);
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / pow;
      const mult = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
      return mult * pow;
    }

    function diagramBounds(points, pad = 1.2) {
      const xs = points.map(p => p[0]).concat([0]);
      const ys = points.map(p => p[1]).concat([0]);
      let xmin = Math.min(...xs) - pad, xmax = Math.max(...xs) + pad;
      let ymin = Math.min(...ys) - pad, ymax = Math.max(...ys) + pad;
      if (xmax - xmin < 2) { const c = (xmin + xmax) / 2; xmin = c - 1; xmax = c + 1; }
      if (ymax - ymin < 2) { const c = (ymin + ymax) / 2; ymin = c - 1; ymax = c + 1; }
      return { xmin, xmax, ymin, ymax };
    }

    function makeDiagramAxes(bounds) {
      const W = 480, H = 320, P = 34;
      const { xmin, xmax, ymin, ymax } = bounds;
      const sx = x => P + ((x - xmin) / (xmax - xmin)) * (W - 2 * P);
      const sy = y => H - P - ((y - ymin) / (ymax - ymin)) * (H - 2 * P);
      const step = diagramStep(Math.max(xmax - xmin, ymax - ymin));
      const fmt = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
      let g = '';

      for (let x = Math.ceil(xmin / step) * step; x <= xmax + 1e-9; x += step) {
        const X = sx(x);
        g += `<line class="dg-grid" x1="${X.toFixed(1)}" y1="${P}" x2="${X.toFixed(1)}" y2="${H - P}"/>`;
      }
      for (let y = Math.ceil(ymin / step) * step; y <= ymax + 1e-9; y += step) {
        const Y = sy(y);
        g += `<line class="dg-grid" x1="${P}" y1="${Y.toFixed(1)}" x2="${W - P}" y2="${Y.toFixed(1)}"/>`;
      }

      const y0 = (ymin <= 0 && ymax >= 0) ? sy(0) : H - P;
      const x0 = (xmin <= 0 && xmax >= 0) ? sx(0) : P;
      if (ymin <= 0 && ymax >= 0) {
        g += `<line class="dg-axis" x1="${P}" y1="${y0.toFixed(1)}" x2="${W - P}" y2="${y0.toFixed(1)}"/>`;
      }
      if (xmin <= 0 && xmax >= 0) {
        g += `<line class="dg-axis" x1="${x0.toFixed(1)}" y1="${P}" x2="${x0.toFixed(1)}" y2="${H - P}"/>`;
      }

      for (let x = Math.ceil(xmin / step) * step; x <= xmax + 1e-9; x += step) {
        if (Math.abs(x) < 1e-9) continue;
        g += `<text class="dg-axis-label" x="${sx(x).toFixed(1)}" y="${Math.min(H - 8, y0 + 13).toFixed(1)}" text-anchor="middle">${fmt(x)}</text>`;
      }
      for (let y = Math.ceil(ymin / step) * step; y <= ymax + 1e-9; y += step) {
        if (Math.abs(y) < 1e-9) continue;
        g += `<text class="dg-axis-label" x="${Math.max(12, x0 - 6).toFixed(1)}" y="${(sy(y) + 3).toFixed(1)}" text-anchor="end">${fmt(y)}</text>`;
      }

      return { svg: g, sx, sy, W, H, P };
    }

    function buildVectorDiagram(p) {
      const x1 = dgNum(p.x1, 1), y1 = dgNum(p.y1, 1);
      const x2 = dgNum(p.x2, 4), y2 = dgNum(p.y2, 3);
      const b = diagramBounds([[x1, y1], [x2, y2]]);
      const a = makeDiagramAxes(b);
      const X1 = a.sx(x1), Y1 = a.sy(y1), X2 = a.sx(x2), Y2 = a.sy(y2);
      const ang = Math.atan2(Y2 - Y1, X2 - X1), h = 10;
      const h1 = [X2 - h * Math.cos(ang - 0.4), Y2 - h * Math.sin(ang - 0.4)];
      const h2 = [X2 - h * Math.cos(ang + 0.4), Y2 - h * Math.sin(ang + 0.4)];
      const handles = p.interactive ? `
        <circle data-dg-handle="a" cx="${X1}" cy="${Y1}" r="12" fill="rgba(99,102,241,0.001)" style="cursor:grab"/>
        <circle data-dg-handle="b" cx="${X2}" cy="${Y2}" r="12" fill="rgba(99,102,241,0.001)" style="cursor:grab"/>` : '';
      const inner = `${a.svg}
        <line class="dg-shape" x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}"/>
        <polygon class="dg-shape-fill" points="${X2},${Y2} ${h1[0]},${h1[1]} ${h2[0]},${h2[1]}"/>
        <circle class="dg-point" data-dg-point="a" cx="${X1}" cy="${Y1}" r="4"/>
        <circle class="dg-point" data-dg-point="b" cx="${X2}" cy="${Y2}" r="4"/>
        <text class="dg-label" x="${X1 + 8}" y="${Y1 - 8}">A</text>
        <text class="dg-label" x="${X2 + 8}" y="${Y2 - 8}">B</text>${handles}`;
      return {
        svg: diagramFrame(inner,
          `data-xmin="${b.xmin}" data-xmax="${b.xmax}" data-ymin="${b.ymin}" data-ymax="${b.ymax}"`),
        caption: p.caption || `Вектор AB: A(${x1}; ${y1}) → B(${x2}; ${y2})`
      };
    }

    function buildCircleDiagram(p) {
      const cx = dgNum(p.cx, 0), cy = dgNum(p.cy, 0), r = Math.abs(dgNum(p.r, 3)) || 1;
      const b = diagramBounds([[cx - r, cy - r], [cx + r, cy + r]]);
      const a = makeDiagramAxes(b);
      const X = a.sx(cx), Y = a.sy(cy), R = Math.abs(a.sx(cx + r) - X);
      const area = (Math.PI * r * r).toFixed(2);
      const inner = `${a.svg}
        <circle class="dg-shape-fill" cx="${X}" cy="${Y}" r="${R}"/>
        <circle class="dg-point" cx="${X}" cy="${Y}" r="3.5"/>
        <line class="dg-shape" x1="${X}" y1="${Y}" x2="${X + R}" y2="${Y}" stroke-dasharray="5 4"/>
        <text class="dg-label" x="${X + R / 2}" y="${Y - 8}" text-anchor="middle">r = ${r}</text>`;
      return {
        svg: diagramFrame(inner),
        caption: p.caption || `Окружность: O(${cx}; ${cy}), r = ${r}. S = πr² ≈ ${area}`
      };
    }

    function buildTriangleDiagram(p) {
      const base = Math.abs(dgNum(p.base, 6)) || 6;
      const height = Math.abs(dgNum(p.height, 4)) || 4;
      const b = diagramBounds([[0, 0], [base, 0], [base / 2, height]]);
      const a = makeDiagramAxes(b);
      const x0 = a.sx(0), y0 = a.sy(0);
      const x1 = a.sx(base), y1 = a.sy(0);
      const xa = a.sx(base / 2), ya = a.sy(height);
      const area = (0.5 * base * height).toFixed(2);
      const inner = `${a.svg}
        <polygon class="dg-shape-fill" points="${x0},${y0} ${x1},${y1} ${xa},${ya}"/>
        <line class="dg-shape" x1="${xa}" y1="${ya}" x2="${xa}" y2="${y0}" stroke-dasharray="5 4"/>
        <text class="dg-label" x="${(x0 + x1) / 2}" y="${y0 + 18}" text-anchor="middle">b = ${base}</text>
        <text class="dg-label" x="${xa + 8}" y="${(ya + y0) / 2}">h = ${height}</text>`;
      return {
        svg: diagramFrame(inner),
        caption: p.caption || `Треугольник: b = ${base}, h = ${height}. S = ½·b·h = ${area}`
      };
    }

    function buildRectangleDiagram(p) {
      const w = Math.abs(dgNum(p.w, 5)) || 5;
      const h = Math.abs(dgNum(p.h, 3)) || 3;
      const b = diagramBounds([[0, 0], [w, 0], [w, h], [0, h]]);
      const a = makeDiagramAxes(b);
      const x0 = a.sx(0), y0 = a.sy(0), x1 = a.sx(w), y1 = a.sy(h);
      const area = (w * h).toFixed(2);
      const inner = `${a.svg}
        <rect class="dg-shape-fill" x="${x0}" y="${y1}" width="${x1 - x0}" height="${y0 - y1}"/>
        <text class="dg-label" x="${(x0 + x1) / 2}" y="${y0 + 18}" text-anchor="middle">a = ${w}</text>
        <text class="dg-label" x="${x1 + 8}" y="${(y0 + y1) / 2}">b = ${h}</text>`;
      return {
        svg: diagramFrame(inner),
        caption: p.caption || `Прямоугольник: a = ${w}, b = ${h}. S = a·b = ${area}`
      };
    }

    function buildPlaneDiagram(p) {
      let min = dgNum(p.min, -5), max = dgNum(p.max, 5);
      if (min >= max) { min = -5; max = 5; }
      const b = { xmin: min, xmax: max, ymin: min, ymax: max };
      const a = makeDiagramAxes(b);
      let inner = a.svg;
      if (Array.isArray(p.points)) {
        p.points.forEach((pt, idx) => {
          const px = dgNum(pt[0], 0), py = dgNum(pt[1], 0);
          const X = a.sx(px), Y = a.sy(py);
          const label = (p.labels && p.labels[idx]) || `P${idx + 1}`;
          inner += `<circle class="dg-point" cx="${X}" cy="${Y}" r="4"/>
            <text class="dg-label" x="${X + 8}" y="${Y - 8}">${svgEsc(label)}</text>`;
        });
      }
      return {
        svg: diagramFrame(inner),
        caption: p.caption || `Координатная плоскость: x, y ∈ [${min}; ${max}]`
      };
    }

    // Безопасный парсер выражений (без eval): + - * / ^, скобки, x, pi, e и функции
    function compileMathExpression(expr) {
      const src = String(expr || '').replace(/\s+/g, '').replace(/,/g, '.');
      let pos = 0;
      const peek = () => src[pos];
      const eat = c => { if (src[pos] === c) pos++; else throw new Error('Ожидается «' + c + '»'); };
      const matchNum = () => {
        const m = /^(?:\d+\.?\d*|\.\d+)/.exec(src.slice(pos));
        if (!m) return null;
        pos += m[0].length;
        return parseFloat(m[0]);
      };
      const matchId = () => {
        const m = /^[a-zA-Z]+/.exec(src.slice(pos));
        if (!m) return null;
        pos += m[0].length;
        return m[0];
      };
      const fns = {
        sin: Math.sin, cos: Math.cos, tan: Math.tan, sqrt: Math.sqrt,
        abs: Math.abs, ln: Math.log, log: Math.log10, exp: Math.exp
      };
      function parseExpr() {
        let v = parseTerm();
        while (peek() === '+' || peek() === '-') {
          const op = src[pos++], r = parseTerm(), l = v;
          v = op === '+' ? (x => l(x) + r(x)) : (x => l(x) - r(x));
        }
        return v;
      }
      function parseTerm() {
        let v = parseUnary();
        while (peek() === '*' || peek() === '/') {
          const op = src[pos++], r = parseUnary(), l = v;
          v = op === '*' ? (x => l(x) * r(x)) : (x => l(x) / r(x));
        }
        return v;
      }
      function parseUnary() {
        if (peek() === '-') { pos++; const v = parseUnary(); return x => -v(x); }
        if (peek() === '+') { pos++; return parseUnary(); }
        return parsePower();
      }
      function parsePower() {
        const base = parsePrimary();
        if (peek() === '^') { pos++; const exp = parseUnary(); return x => Math.pow(base(x), exp(x)); }
        return base;
      }
      function parsePrimary() {
        if (peek() === '(') { pos++; const v = parseExpr(); eat(')'); return v; }
        const n = matchNum();
        if (n !== null) return () => n;
        const id = matchId();
        if (id) {
          if (id === 'x') return x => x;
          if (id === 'pi') return () => Math.PI;
          if (id === 'e') return () => Math.E;
          if (fns[id]) {
            eat('(');
            const arg = parseExpr();
            eat(')');
            return x => fns[id](arg(x));
          }
          throw new Error('Неизвестная функция: ' + id);
        }
        throw new Error('Ошибка в выражении');
      }
      const fn = parseExpr();
      if (pos !== src.length) throw new Error('Лишние символы в выражении');
      return fn;
    }

    function buildFunctionDiagram(p) {
      const expr = String(p.expr || 'x^2').trim() || 'x^2';
      let xmin = dgNum(p.xmin, -4), xmax = dgNum(p.xmax, 4);
      if (xmin >= xmax) { xmin = -4; xmax = 4; }
      let fn;
      try { fn = compileMathExpression(expr); }
      catch (e) { return { error: e.message || 'Ошибка в выражении' }; }

      const N = 240, pts = [];
      for (let i = 0; i <= N; i++) {
        const x = xmin + (xmax - xmin) * i / N;
        const y = fn(x);
        if (Number.isFinite(y)) pts.push([x, y]);
      }
      if (!pts.length) return { error: 'Функция не даёт конечных значений' };

      let ymin = Math.min(...pts.map(p => p[1]));
      let ymax = Math.max(...pts.map(p => p[1]));
      const pad = Math.max(1, (ymax - ymin) * 0.15);
      ymin -= pad; ymax += pad;
      if (ymax - ymin < 2) { const c = (ymin + ymax) / 2; ymin = c - 1; ymax = c + 1; }
      const b = { xmin, xmax, ymin, ymax };
      const a = makeDiagramAxes(b);

      let d = '', prevY = null;
      for (const [x, y] of pts) {
        const X = a.sx(x), Y = a.sy(y);
        if (prevY !== null && Math.abs(Y - prevY) > 220) d += ` M ${X.toFixed(1)} ${Y.toFixed(1)}`;
        else d += (d ? ' L ' : 'M ') + `${X.toFixed(1)} ${Y.toFixed(1)}`;
        prevY = Y;
      }
      const inner = `${a.svg}
        <path class="dg-shape" d="${d}" fill="none"/>
        <text class="dg-label" x="${a.P}" y="${a.P - 10}">y = ${svgEsc(expr)}</text>`;
      return {
        svg: diagramFrame(inner),
        caption: p.caption || `График y = ${expr}`
      };
    }

    function buildDiagram(type, p) {
      switch (type) {
        case 'vector': return buildVectorDiagram(p);
        case 'circle': return buildCircleDiagram(p);
        case 'triangle': return buildTriangleDiagram(p);
        case 'rectangle': return buildRectangleDiagram(p);
        case 'plane': return buildPlaneDiagram(p);
        case 'function': return buildFunctionDiagram(p);
        default: return { error: 'Неизвестный тип схемы' };
      }
    }

    function renderQuestionDiagram(q) {
      if (!q || !q.diagram) return '';
      const d = q.diagram;
      let media = '';
      if (d.svg) media = d.svg;
      else if (d.dataUrl) media = `<img class="q-diagram-img" src="${d.dataUrl}" alt="${svgEsc(d.caption || 'Схема')}">`;
      else return '';
      const cap = d.caption ? `<figcaption>${escapeHtml(d.caption)}</figcaption>` : '';
      return `<figure class="q-diagram">${media}${cap}</figure>`;
    }

              <button type="button" class="btn-ghost" id="dgCancel">${dict.cancel}</button>
              <button type="button" class="btn-primary" id="dgInsert">${dict.dgInsert}</button>
            </div>
          </div>

    function updateDiagramFields() {
      const type = document.getElementById('dgType')?.value || 'vector';
      document.querySelectorAll('#diagramOverlay [data-dg-type]').forEach(el => {
        el.style.display = el.dataset.dgType === type ? 'flex' : 'none';
      });
      updateDiagramPreview();
    }

    function readDiagramParams(type) {
      const val = id => document.getElementById(id)?.value || '';
      if (type === 'vector') return { x1: val('dgX1'), y1: val('dgY1'), x2: val('dgX2'), y2: val('dgY2') };
      if (type === 'circle') return { cx: val('dgCx'), cy: val('dgCy'), r: val('dgR') };
      if (type === 'triangle') return { base: val('dgBase'), height: val('dgHeight') };
      if (type === 'rectangle') return { w: val('dgW'), h: val('dgH') };
      if (type === 'plane') return { min: val('dgMin'), max: val('dgMax') };
      if (type === 'function') return { expr: val('dgExpr'), xmin: val('dgXmin'), xmax: val('dgXmax') };
      return {};
    }

    function updateDiagramPreview() {
      const dict = translations[currentLang];
      const type = document.getElementById('dgType')?.value || 'vector';
      const preview = document.getElementById('dgPreview');
      const captionEl = document.getElementById('dgCaption');
      if (!preview) return;
      const caption = captionEl ? captionEl.value.trim() : '';
      currentDiagramDraft = null;

      if (type === 'image') {
        if (currentDiagramImage) {
          preview.innerHTML = `<img src="${currentDiagramImage}" alt="${dict.diagramTitle}">`;
          currentDiagramDraft = { type: 'image', diagramType: 'image', dataUrl: currentDiagramImage, caption };
        } else {
          preview.innerHTML = `<div class="dg-error">${dict.dgNoFile}</div>`;
        }
        return;
      }

      const params = readDiagramParams(type);
      params.caption = caption;
      params.interactive = true;               // в модалке вектор можно перетаскивать
      const res = buildDiagram(type, params);
      if (res.error) {
        preview.innerHTML = `<div class="dg-error" title="${escapeHtml(res.error)}">${dict.dgInvalid}</div>`;
        return;
      }
      preview.innerHTML = res.svg;
      // В сохраняемую схему не тащим служебные drag-хэндлы
      const clean = buildDiagram(type, { ...params, interactive: false });
      currentDiagramDraft = {
        type: 'svg',
        diagramType: type,
        params: { ...params },
        svg: (clean && clean.svg) || res.svg,
        caption: caption || res.caption || ''
      };
      if (type === 'vector') bindVectorHandles();
    }

    // Перетаскивание точек A/B вектора прямо в preview модалки
    function bindVectorHandles() {
      const preview = document.getElementById('dgPreview');
      if (!preview) return;
      const svg = preview.querySelector('svg');
      if (!svg || !svg.dataset.xmin) return;
      const handles = svg.querySelectorAll('[data-dg-handle]');
      if (!handles.length) return;

      const xmin = Number(svg.dataset.xmin), xmax = Number(svg.dataset.xmax);
      const ymin = Number(svg.dataset.ymin), ymax = Number(svg.dataset.ymax);
      const P = 34, W = 480, H = 320;
      const toWorld = ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.clientX - r.left) * W / r.width;
        const py = (ev.clientY - r.top) * H / r.height;
        let x = xmin + ((px - P) / (W - 2 * P)) * (xmax - xmin);
        let y = ymin + ((H - P - py) / (H - 2 * P)) * (ymax - ymin);
        x = Math.max(xmin, Math.min(xmax, x));
        y = Math.max(ymin, Math.min(ymax, y));
        return { x, y };
      };
      const toPx = w => ({
        x: P + ((w.x - xmin) / (xmax - xmin)) * (W - 2 * P),
        y: H - P - ((w.y - ymin) / (ymax - ymin)) * (H - 2 * P)
      });

      handles.forEach(handle => {
        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const key = handle.dataset.dgHandle;
          const line = svg.querySelector('line.dg-shape');
          const point = svg.querySelector(`circle[data-dg-point="${key}"]`);

          const onMove = (ev) => {
            const pt = toPx(toWorld(ev));
            handle.setAttribute('cx', pt.x);
            handle.setAttribute('cy', pt.y);
            if (point) { point.setAttribute('cx', pt.x); point.setAttribute('cy', pt.y); }
            if (line) {
              if (key === 'a') { line.setAttribute('x1', pt.x); line.setAttribute('y1', pt.y); }
              else { line.setAttribute('x2', pt.x); line.setAttribute('y2', pt.y); }
            }
          };
          const onUp = (ev) => {
            window.removeEventListener('pointermove', onMove);
            const w = toWorld(ev);
            const rx = Math.round(w.x * 2) / 2;
            const ry = Math.round(w.y * 2) / 2;
            const xi = document.getElementById(key === 'a' ? 'dgX1' : 'dgX2');
            const yi = document.getElementById(key === 'a' ? 'dgY1' : 'dgY2');
            if (xi) xi.value = rx;
            if (yi) yi.value = ry;
            updateDiagramPreview();
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp, { once: true });
        });
      });
    }

    function openDiagramModal(editIndex = null) {
      try { if (window.mathVirtualKeyboard) window.mathVirtualKeyboard.hide(); } catch (e) {}
      const dict = translations[currentLang];
      diagramEditingIndex = (typeof editIndex === 'number') ? editIndex : null;

      let overlay = document.getElementById('diagramOverlay');
      // При смене языка пересоздаём модалку, чтобы подписи были актуальными
      if (overlay && overlay.dataset.lang !== currentLang) {
        overlay.remove();
        overlay = null;
      }
      if (!overlay) {
        document.body.insertAdjacentHTML('beforeend', diagramModalHTML());
        overlay = document.getElementById('diagramOverlay');
        overlay.dataset.lang = currentLang;
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay || e.target.closest('#dgClose') || e.target.closest('#dgCancel')) {
            closeDiagramModal();
            return;
          }
          if (e.target.closest('#dgDelete')) { deleteDiagramFromQuestion(); return; }
          if (e.target.closest('#dgInsert')) insertDiagramFromModal();
        });
        document.getElementById('dgType').addEventListener('change', updateDiagramFields);
        overlay.querySelectorAll('input[type="number"], #dgExpr, #dgCaption').forEach(inp => {
          inp.addEventListener('input', updateDiagramPreview);
        });
        document.getElementById('dgImage').addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) { currentDiagramImage = null; updateDiagramPreview(); return; }
          if (file.size > 1024 * 1024) {
            alert(dict.dgFileTooBig);
            e.target.value = '';
            currentDiagramImage = null;
            updateDiagramPreview();
            return;
          }
          const reader = new FileReader();
          reader.onload = () => { currentDiagramImage = String(reader.result || ''); updateDiagramPreview(); };
          reader.readAsDataURL(file);
        });
        document.addEventListener('keydown', (e) => {
          const o = document.getElementById('diagramOverlay');
          if (e.key === 'Escape' && o && !o.classList.contains('hidden')) closeDiagramModal();
        });
      }

      // Сброс полей к значениям по умолчанию
      currentDiagramImage = null;
      const defaults = {
        dgX1: '1', dgY1: '1', dgX2: '4', dgY2: '3',
        dgCx: '0', dgCy: '0', dgR: '3',
        dgBase: '6', dgHeight: '4',
        dgW: '5', dgH: '3',
        dgMin: '-5', dgMax: '5',
        dgExpr: 'x^2', dgXmin: '-4', dgXmax: '4'
      };
      Object.entries(defaults).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) el.value = val;
      });

      const editing = diagramEditingIndex !== null && currentTestDraft &&
        currentTestDraft.questions && currentTestDraft.questions[diagramEditingIndex];
      const existing = editing ? currentTestDraft.questions[diagramEditingIndex].diagram : null;
      const typeSel = document.getElementById('dgType');
      const cap = document.getElementById('dgCaption');
      if (typeSel) typeSel.value = existing && existing.diagramType ? existing.diagramType : 'vector';
      if (cap) cap.value = (existing && existing.caption) || '';

      if (existing && existing.params) {
        const p = existing.params;
        const map = {
          dgX1: p.x1, dgY1: p.y1, dgX2: p.x2, dgY2: p.y2,
          dgCx: p.cx, dgCy: p.cy, dgR: p.r,
          dgBase: p.base, dgHeight: p.height,
          dgW: p.w, dgH: p.h,
          dgMin: p.min, dgMax: p.max,
          dgExpr: p.expr, dgXmin: p.xmin, dgXmax: p.xmax
        };
        Object.entries(map).forEach(([id, val]) => {
          if (val !== undefined && val !== null) {
            const el = document.getElementById(id);
            if (el) el.value = val;
          }
        });
      }
      if (existing && existing.type === 'image' && existing.dataUrl) {
        currentDiagramImage = existing.dataUrl;
      }

      const title = document.getElementById('dgTitle');
      if (title) title.textContent = '📐 ' + (editing ? dict.diagramEditTitle : dict.diagramTitle);
      const del = document.getElementById('dgDelete');
      if (del) del.style.display = editing ? 'inline-flex' : 'none';

      updateDiagramFields();

      // Старая схема без params: показываем ровно её, пока пользователь не изменит параметры
      if (existing && existing.svg && !existing.params && existing.diagramType !== 'image') {
        const preview = document.getElementById('dgPreview');
        if (preview) preview.innerHTML = existing.svg;
        currentDiagramDraft = { ...existing };
      }

      overlay.classList.remove('hidden');
    }

    function deleteDiagramFromQuestion() {
      if (diagramEditingIndex !== null && currentTestDraft && currentTestDraft.questions) {
        currentTestDraft.questions[diagramEditingIndex].diagram = null;
        renderQuestionList();
      }
      closeDiagramModal();
    }

    function closeDiagramModal() {
      const overlay = document.getElementById('diagramOverlay');
      if (overlay) overlay.classList.add('hidden');
      try { if (window.mathVirtualKeyboard) window.mathVirtualKeyboard.hide(); } catch (e) {}
    }

    function insertDiagramFromModal() {
      const dict = translations[currentLang];
      if (!currentDiagramDraft) {
        alert(dict.dgErrorNotReady);
        return;
      }
      if (diagramEditingIndex !== null && currentTestDraft && currentTestDraft.questions) {
        currentTestDraft.questions[diagramEditingIndex].diagram = { ...currentDiagramDraft };
        renderQuestionList();
      } else {
        pendingDiagram = { ...currentDiagramDraft };
        renderPendingDiagram();
      }
      closeDiagramModal();
    }

      const dict = translations[currentLang];
      const box = document.getElementById('qDiagramPreview');

      if (!pendingDiagram) {
        box.classList.add('hidden');
        box.innerHTML = '';
        return;
